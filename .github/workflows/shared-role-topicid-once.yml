name: Apply Shared Role Topic ID Once

on:
  push:
    branches:
      - shared-wal-s3-4.3.1
    paths:
      - '.github/workflows/shared-role-topicid-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout normalized branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 200
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for author normalization
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            git fetch origin shared-wal-s3-4.3.1 --force
            head=$(git rev-parse origin/shared-wal-s3-4.3.1)
            email=$(git show -s --format='%ae' "$head")
            if [ "$email" = "jianbin@apache.org" ]; then
              git reset --hard "$head"
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Use metadata delta topic IDs for role notifications
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('core/src/main/scala/kafka/server/ReplicaManager.scala')
          text = p.read_text()
          old = '\n'.join([
              '        val storageLeaderChanges = leaderChangedPartitions.flatMap { partition =>',
              '          partition.topicId.map(topicId => new TopicIdPartition(topicId, partition.topicPartition))',
              '        }.asJava',
              '        val storageFollowerChanges = followerChangedPartitions.flatMap { partition =>',
              '          partition.topicId.map(topicId => new TopicIdPartition(topicId, partition.topicPartition))',
              '        }.asJava',
          ])
          new = '\n'.join([
              '        val storageLeaderChanges = leaderChangedPartitions.flatMap { partition =>',
              '          Option(localChanges.topicIds().get(partition.topicPartition.topic()))',
              '            .map(topicId => new TopicIdPartition(topicId, partition.topicPartition))',
              '        }.asJava',
              '        val storageFollowerChanges = followerChangedPartitions.flatMap { partition =>',
              '          Option(localChanges.topicIds().get(partition.topicPartition.topic()))',
              '            .map(topicId => new TopicIdPartition(topicId, partition.topicPartition))',
              '        }.asJava',
          ])
          if text.count(old) != 1:
              raise SystemExit(f'expected role block exactly once, got {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/shared-role-topicid-once.yml
          git diff --check
          grep -q 'localChanges.topicIds().get(partition.topicPartition.topic())' core/src/main/scala/kafka/server/ReplicaManager.scala

      - name: Commit exact core patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Jianbin Chen"
          git config user.email "jianbin@apache.org"
          git add core/src/main/scala/kafka/server/ReplicaManager.scala .github/workflows/shared-role-topicid-once.yml
          git commit -m "KAFKA-Shared: route replica roles with authoritative topic IDs"
          git push origin HEAD:shared-wal-s3-4.3.1
