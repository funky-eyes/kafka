name: Shared Storage KRaft Controller HA

on:
  push:
    branches:
      - shared-wal-s3-4.3.1
    paths:
      - 'storage/src/main/java/org/apache/kafka/storage/internals/shared/**'
      - 'storage/shared-storage-s3/**'
      - 'core/src/main/scala/kafka/cluster/Partition.scala'
      - 'core/src/main/scala/kafka/log/LogManager.scala'
      - 'core/src/main/scala/kafka/server/BrokerServer.scala'
      - 'core/src/main/scala/kafka/server/ControllerServer.scala'
      - 'core/src/main/scala/kafka/server/ReplicaManager.scala'
      - 'core/src/test/java/kafka/server/SharedStorageControllerQuorumE2ETest.java'
      - '.github/workflows/shared-storage-controller-ha.yml'
  pull_request:
    paths:
      - 'storage/src/main/java/org/apache/kafka/storage/internals/shared/**'
      - 'storage/shared-storage-s3/**'
      - 'core/src/main/scala/kafka/cluster/Partition.scala'
      - 'core/src/main/scala/kafka/log/LogManager.scala'
      - 'core/src/main/scala/kafka/server/BrokerServer.scala'
      - 'core/src/main/scala/kafka/server/ControllerServer.scala'
      - 'core/src/main/scala/kafka/server/ReplicaManager.scala'
      - 'core/src/test/java/kafka/server/SharedStorageControllerQuorumE2ETest.java'
      - '.github/workflows/shared-storage-controller-ha.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-storage-controller-ha-${{ github.ref }}
  cancel-in-progress: false

jobs:
  controller-quorum-ha:
    name: Three-controller quorum failover with shared data plane
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Start MinIO
        run: |
          docker run --detach \
            --name kafka-shared-controller-ha-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadmin123 \
            minio/minio:latest \
            server /data --address :9000

      - name: Wait for MinIO readiness
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs kafka-shared-controller-ha-minio
          exit 1

      - name: Ensure MinIO bucket exists
        run: |
          docker run --rm --network host --entrypoint /bin/sh minio/mc:latest -c '
            mc alias set local http://127.0.0.1:9000 minioadmin minioadmin123 >/dev/null &&
            mc mb --ignore-existing local/kafka-shared-storage-controller-ha >/dev/null
          '

      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          java-version: 25
          gradle-cache-read-only: true

      - name: Exercise KRaft controller quorum failover
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin123
          AWS_REGION: us-east-1
          SHARED_STORAGE_S3_ENDPOINT: http://127.0.0.1:9000
          SHARED_STORAGE_S3_REGION: us-east-1
          SHARED_STORAGE_S3_BUCKET: kafka-shared-storage-controller-ha
        run: |
          set -o pipefail
          ./gradlew :core:test \
            --tests 'kafka.server.SharedStorageControllerQuorumE2ETest' \
            --no-scan 2>&1 | tee shared-storage-controller-ha.log

      - name: Show controller-HA S3 objects
        if: always()
        run: |
          docker run --rm --network host --entrypoint /bin/sh minio/mc:latest -c '
            mc alias set local http://127.0.0.1:9000 minioadmin minioadmin123 >/dev/null &&
            mc ls --recursive local/kafka-shared-storage-controller-ha || true
          ' | tee shared-storage-controller-ha-objects.log

      - name: Upload controller-HA diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-storage-controller-ha
          path: |
            shared-storage-controller-ha.log
            shared-storage-controller-ha-objects.log
            core/build/reports/tests/test
            core/build/test-results/test
          if-no-files-found: ignore
          retention-days: 7

      - name: MinIO logs
        if: always()
        run: docker logs kafka-shared-controller-ha-minio || true
