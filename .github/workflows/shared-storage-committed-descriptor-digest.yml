name: Shared Storage COMMITTED Descriptor Digest

on:
  push:
    branches:
      - codex/committed-descriptor-digest
    paths:
      - 'storage/src/main/java/org/apache/kafka/storage/internals/shared/metadata/CommittedObjectDescriptorDigest.java'
      - 'storage/src/test/java/org/apache/kafka/storage/internals/shared/metadata/CommittedObjectDescriptorDigestTest.java'
      - '.github/workflows/shared-storage-committed-descriptor-digest.yml'
  pull_request:
    paths:
      - 'storage/src/main/java/org/apache/kafka/storage/internals/shared/metadata/CommittedObjectDescriptorDigest.java'
      - 'storage/src/test/java/org/apache/kafka/storage/internals/shared/metadata/CommittedObjectDescriptorDigestTest.java'
      - '.github/workflows/shared-storage-committed-descriptor-digest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Configure Java 25 and Gradle
        uses: ./.github/actions/setup-gradle
        with:
          java-version: 25
          gradle-cache-read-only: true
      - name: Verify canonical immutable KSO2 descriptor hashing
        run: |
          # Global Storage Checkstyle runs in the shared-storage parent workflow;
          # this specialized workflow runs only its targeted correctness test.
          ./gradlew :storage:test \
            --tests 'org.apache.kafka.storage.internals.shared.metadata.CommittedObjectDescriptorDigestTest' \
            --no-scan --max-workers=2 -PmaxParallelForks=1
