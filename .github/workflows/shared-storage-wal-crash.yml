name: Shared Storage WAL Crash Windows

on:
  push:
    branches:
      - shared-wal-s3-4.3.1
    paths:
      - 'storage/src/main/java/org/apache/kafka/storage/internals/shared/wal/**'
      - 'storage/src/test/java/org/apache/kafka/storage/internals/shared/wal/**'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/shared/kafka/SharedStorageConfiguration.java'
      - 'storage/shared-storage-s3/src/main/java/org/apache/kafka/storage/internals/shared/s3/S3SharedStorageExtension.java'
      - 'storage/shared-storage-s3/src/test/java/org/apache/kafka/storage/internals/shared/s3/S3SharedStorageWalFactoryTest.java'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/shared/metadata/LocalRemoteObjectCheckpoint.java'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/shared/metadata/RemoteObjectIndex.java'
      - 'storage/src/test/java/org/apache/kafka/storage/internals/shared/metadata/LocalRemoteObjectCheckpointTest.java'
      - 'storage/src/test/java/org/apache/kafka/storage/internals/shared/metadata/RemoteObjectIndexTest.java'
      - '.github/workflows/shared-storage-wal-crash.yml'
  pull_request:
    paths:
      - 'storage/src/main/java/org/apache/kafka/storage/internals/shared/wal/**'
      - 'storage/src/test/java/org/apache/kafka/storage/internals/shared/wal/**'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/shared/kafka/SharedStorageConfiguration.java'
      - 'storage/shared-storage-s3/src/main/java/org/apache/kafka/storage/internals/shared/s3/S3SharedStorageExtension.java'
      - 'storage/shared-storage-s3/src/test/java/org/apache/kafka/storage/internals/shared/s3/S3SharedStorageWalFactoryTest.java'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/shared/metadata/LocalRemoteObjectCheckpoint.java'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/shared/metadata/RemoteObjectIndex.java'
      - 'storage/src/test/java/org/apache/kafka/storage/internals/shared/metadata/LocalRemoteObjectCheckpointTest.java'
      - 'storage/src/test/java/org/apache/kafka/storage/internals/shared/metadata/RemoteObjectIndexTest.java'
      - '.github/workflows/shared-storage-wal-crash.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-storage-wal-crash-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crash-window-gate:
    name: WAL crash-window, checkpoint and reclaim gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          java-version: 25
          gradle-cache-read-only: true

      - name: Run deterministic WAL crash-window, checkpoint and reclaim tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :storage:test --no-scan \
            --tests 'org.apache.kafka.storage.internals.shared.wal.FileSharedWalTest' \
            --tests 'org.apache.kafka.storage.internals.shared.wal.FileSharedWalCrashWindowTest' \
            --tests 'org.apache.kafka.storage.internals.shared.wal.RotatingFileSharedWalTest' \
            --tests 'org.apache.kafka.storage.internals.shared.wal.RingSharedWalCrashWindowTest' \
            --tests 'org.apache.kafka.storage.internals.shared.wal.RemoteCoverageWalReclaimPolicyTest' \
            --tests 'org.apache.kafka.storage.internals.shared.metadata.LocalRemoteObjectCheckpointTest' \
            --tests 'org.apache.kafka.storage.internals.shared.metadata.RemoteObjectIndexTest' \
            2>&1 | tee shared-storage-wal-crash.log

      - name: Upload crash-window diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-storage-wal-crash-window-log
          path: |
            shared-storage-wal-crash.log
            storage/build/reports/tests/test
            storage/build/reports/checkstyle
          if-no-files-found: ignore
          retention-days: 7
