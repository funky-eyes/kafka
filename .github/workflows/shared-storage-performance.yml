name: Shared Storage Performance Baseline

on:
  push:
    branches:
      - shared-wal-s3-4.3.1
    paths:
      - 'core/src/test/java/kafka/server/SharedStoragePerformanceBaselineTest.java'
      - '.github/workflows/shared-storage-performance.yml'
  workflow_dispatch:
    inputs:
      records:
        description: Records per classic/shared benchmark run
        required: true
        default: "10000"
        type: string
      min_produce_ratio:
        description: Minimum shared/classic acks=all produce throughput ratio
        required: true
        default: "0.60"
        type: string
      min_consume_ratio:
        description: Minimum shared/classic hot-read consume throughput ratio
        required: true
        default: "0.50"
        type: string

permissions:
  contents: read

jobs:
  relative-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start MinIO
        run: |
          docker run -d --rm --network host \
            --name kafka-shared-performance-minio \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadmin123 \
            quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z \
            server /data --address :9000

      - name: Wait for MinIO readiness
        run: |
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs kafka-shared-performance-minio
          exit 1

      - name: Ensure MinIO bucket exists
        run: |
          docker run --rm --network host --entrypoint /bin/sh \
            quay.io/minio/mc:RELEASE.2025-07-21T05-28-08Z -c '
              mc alias set local http://127.0.0.1:9000 minioadmin minioadmin123 >/dev/null &&
              mc mb --ignore-existing local/kafka-shared-storage-performance
            '

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run classic/shared relative throughput baseline
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin123
          AWS_REGION: us-east-1
          SHARED_STORAGE_S3_ENDPOINT: http://127.0.0.1:9000
          SHARED_STORAGE_S3_BUCKET: kafka-shared-storage-performance
          SHARED_STORAGE_PERF_RECORDS: ${{ inputs.records || '10000' }}
          SHARED_STORAGE_MIN_PRODUCE_RATIO: ${{ inputs.min_produce_ratio || '0.60' }}
          SHARED_STORAGE_MIN_CONSUME_RATIO: ${{ inputs.min_consume_ratio || '0.50' }}
        run: |
          set -o pipefail
          ./gradlew :core:test \
            --tests 'kafka.server.SharedStoragePerformanceBaselineTest' \
            -x :core:checkstyleMain \
            -x :core:checkstyleTest \
            -x :core:spotbugsMain \
            -x :core:spotbugsTest \
            --no-scan 2>&1 | tee shared-storage-performance.log

      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-storage-performance-evidence
          path: |
            shared-storage-performance.log
            core/build/test-results/test/**
          if-no-files-found: warn

      - name: MinIO logs
        if: failure()
        run: docker logs kafka-shared-performance-minio || true
