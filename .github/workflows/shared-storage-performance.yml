name: Shared Storage Performance Baseline

on:
  push:
    branches:
      - shared-wal-s3-4.3.1
    paths:
      - 'gradle.properties'
      - 'gradle/dependencies.gradle'
      - 'gradlew'
      - 'wrapper.gradle'
      - 'gradle/wrapper/gradle-wrapper.properties'
      # Every production-fingerprint change invalidates this gate's GA evidence.
      - 'build.gradle'
      - 'settings.gradle'
      - 'storage/shared-storage-s3/build.gradle'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/shared/**'
      - 'storage/shared-storage-s3/src/main/**'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/log/**'
      - 'core/src/main/scala/kafka/cluster/Partition.scala'
      - 'core/src/main/scala/kafka/log/LogManager.scala'
      - 'core/src/main/scala/kafka/server/**'
      - 'core/src/main/java/kafka/server/builders/LogManagerBuilder.java'
      - 'core/src/test/java/kafka/server/SharedStoragePerformanceBaselineTest.java'
      - '.github/actions/setup-gradle/**'
      - '.github/actions/setup-minio/**'
      - 'tools/shared_storage_minio_fixture.sh'
      - '.github/workflows/shared-storage-performance.yml'
  workflow_dispatch:
    inputs:
      records:
        description: Records per classic/shared benchmark run
        required: true
        default: "50000"
        type: string
      warmup_records:
        description: Untimed records used to warm each classic/shared topic before measurement
        required: true
        default: "20000"
        type: string
      repetitions:
        description: Same-cluster classic/shared benchmark pairs; must be even so both execution orders are balanced
        required: true
        default: "4"
        type: string
      min_produce_ratio:
        description: Minimum shared/classic acks=all produce throughput ratio
        required: true
        default: "0.60"
        type: string
      min_consume_ratio:
        description: Minimum shared/classic hot-read consume throughput ratio
        required: true
        default: "0.50"
        type: string

permissions:
  contents: read

jobs:
  relative-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup pinned MinIO fixture
        uses: ./.github/actions/setup-minio
        with:
          bucket: kafka-shared-storage-performance
      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          java-version: 25
          gradle-cache-read-only: true

      - name: Run classic/shared relative throughput baseline
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin123
          AWS_REGION: us-east-1
          SHARED_STORAGE_S3_ENDPOINT: http://127.0.0.1:9000
          SHARED_STORAGE_S3_BUCKET: kafka-shared-storage-performance
          SHARED_STORAGE_PERF_RECORDS: ${{ inputs.records || '50000' }}
          SHARED_STORAGE_PERF_WARMUP_RECORDS: ${{ inputs.warmup_records || '20000' }}
          SHARED_STORAGE_PERF_REPETITIONS: ${{ inputs.repetitions || '4' }}
          SHARED_STORAGE_MIN_PRODUCE_RATIO: ${{ inputs.min_produce_ratio || '0.60' }}
          SHARED_STORAGE_MIN_CONSUME_RATIO: ${{ inputs.min_consume_ratio || '0.50' }}
        run: |
          set -o pipefail
          ./gradlew :core:test \
            --tests 'kafka.server.SharedStoragePerformanceBaselineTest' \
            -x :core:checkstyleMain \
            -x :core:checkstyleTest \
            -x :core:spotbugsMain \
            -x :core:spotbugsTest \
            --no-scan 2>&1 | tee shared-storage-performance.log

      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-storage-performance-evidence
          path: |
            shared-storage-performance.log
            core/build/test-results/test/**
          if-no-files-found: warn

      - name: MinIO logs
        if: failure()
        run: |
          "${GITHUB_WORKSPACE}/tools/shared_storage_minio_fixture.sh" logs || true