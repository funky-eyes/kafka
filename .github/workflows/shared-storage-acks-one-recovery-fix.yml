name: Shared Storage acks=1 Recovery Fix

on:
  push:
    branches:
      - shared-wal-s3-4.3.1
    paths:
      - '.github/workflows/shared-storage-acks-one-recovery-fix.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Patch source and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME}"
          git fetch origin "$branch"
          git reset --hard "origin/$branch"
          python3 .github/scripts/fix-acks-one-recovery.py
          rm .github/scripts/fix-acks-one-recovery.py
          rm .github/workflows/shared-storage-acks-one-recovery-fix.yml
          git config user.name 'Jianbin Chen'
          git config user.email 'jianbin@apache.org'
          git add -A
          git commit -m 'KAFKA-Shared: recover acks=1 data with metadata quorum'
          git fetch origin "$branch"
          git rebase "origin/$branch"
          git push origin "HEAD:$branch"
