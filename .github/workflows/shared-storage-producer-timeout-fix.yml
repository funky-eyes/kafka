name: Shared Storage One-shot Producer Timeout Fix

on:
  push:
    branches:
      - shared-wal-s3-4.3.1
    paths:
      - '.github/workflows/shared-storage-producer-timeout-fix.yml'

permissions:
  contents: write

jobs:
  patch-and-remove-self:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Fix producer timeout ordering and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('core/src/test/java/kafka/server/SharedStorageIndependentProcessSigkillTest.java')
          text = path.read_text(encoding='utf-8')
          old = (
              '        properties.put(ProducerConfig.ENABLE_IDEMPOTENCE_CONFIG, idempotent);\n'
              '        properties.put(ProducerConfig.DELIVERY_TIMEOUT_MS_CONFIG, 30_000);\n'
              '        properties.put(ProducerConfig.KEY_SERIALIZER_CLASS_CONFIG, StringSerializer.class);\n'
              '        properties.put(ProducerConfig.VALUE_SERIALIZER_CLASS_CONFIG, StringSerializer.class);\n'
              '        if (!idempotent) {\n'
              '            properties.put(ProducerConfig.RETRIES_CONFIG, 0);\n'
              '            properties.put(ProducerConfig.MAX_BLOCK_MS_CONFIG, 5_000);\n'
              '            properties.put(ProducerConfig.REQUEST_TIMEOUT_MS_CONFIG, 3_000);\n'
              '        }\n'
          )
          new = (
              '        properties.put(ProducerConfig.ENABLE_IDEMPOTENCE_CONFIG, idempotent);\n'
              '        properties.put(ProducerConfig.KEY_SERIALIZER_CLASS_CONFIG, StringSerializer.class);\n'
              '        properties.put(ProducerConfig.VALUE_SERIALIZER_CLASS_CONFIG, StringSerializer.class);\n'
              '        if (idempotent) {\n'
              '            properties.put(ProducerConfig.DELIVERY_TIMEOUT_MS_CONFIG, 120_000);\n'
              '        } else {\n'
              '            properties.put(ProducerConfig.RETRIES_CONFIG, 0);\n'
              '            properties.put(ProducerConfig.MAX_BLOCK_MS_CONFIG, 5_000);\n'
              '            properties.put(ProducerConfig.REQUEST_TIMEOUT_MS_CONFIG, 3_000);\n'
              '            properties.put(ProducerConfig.DELIVERY_TIMEOUT_MS_CONFIG, 10_000);\n'
              '        }\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one producer timeout block, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          rm .github/workflows/shared-storage-producer-timeout-fix.yml
          git config user.name 'Jianbin Chen'
          git config user.email 'jianbin@apache.org'
          git add core/src/test/java/kafka/server/SharedStorageIndependentProcessSigkillTest.java \
            .github/workflows/shared-storage-producer-timeout-fix.yml
          git commit -m 'KAFKA-Shared: fix durability probe producer timeouts'
          git push origin "HEAD:${GITHUB_REF_NAME}"
