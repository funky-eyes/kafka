name: Audit Shared Storage Commit Provenance

on:
  push:
    branches:
      - shared-wal-s3-4.3.1

permissions:
  actions: read
  contents: read

jobs:
  audit-source:
    concurrency:
      group: shared-storage-source-audit-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable triggering commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source and audit historical attribution
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          TARGET_EMAIL: jianbin@apache.org
        run: |
          set -euo pipefail

          # Never rewrite published merge history or change commit identities.
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          # The previous BASE_SHA can disappear after earlier Git history
          # normalization. Audit only commits reachable from the exact pushed
          # source SHA; do not fetch or assume a stale historical anchor.
          # This is attribution telemetry, never permission to rewrite history.
          differing_identities="$(git log -n 256 "${SOURCE_SHA}" --format='%ae%n%ce' |
            grep -cvFx "${TARGET_EMAIL}" || true)"
          echo "::notice title=Immutable source history::source=${SOURCE_SHA} non-target author/committer fields=${differing_identities}; preserving original attribution and all accepted commits"

  seal-ga-evidence:
    name: Seal GA evidence for immutable source commit
    needs: audit-source
    concurrency:
      group: shared-storage-ga-seal-shared-wal-s3-4.3.1
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact release SHA
        id: release-sha
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "sha=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Test GA manifest evidence rules
        run: python3 tools/test_shared_storage_ga_manifest.py

      - name: Validate GA workflow consistency
        run: python3 tools/check_shared_storage_ga_workflows.py

      - name: Wait for terminal GA evidence
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVIDENCE_BRANCH: shared-wal-s3-4.3.1
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_SHA: ${{ steps.release-sha.outputs.sha }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1200))
          source_attempt=0

          while true; do
            source_attempt=$((source_attempt + 1))
            set +e
            python3 tools/shared_storage_ga_source_runs.py \
              --repo "${{ github.repository }}" \
              --branch "${EVIDENCE_BRANCH}" \
              --sha "${SOURCE_SHA}" \
              > /tmp/shared-storage-source-runs.out 2>&1
            source_status=$?
            set -e
            cat /tmp/shared-storage-source-runs.out

            if [ "${source_status}" -eq 0 ]; then
              break
            fi
            if [ "${source_status}" -eq 2 ]; then
              echo "Source-SHA evidence has a terminal failure; evaluating the full manifest now."
              break
            fi
            if [ "${source_status}" -ne 1 ]; then
              exit "${source_status}"
            fi
            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "Source-SHA evidence wait reached the deadline; evaluating the full manifest now."
              break
            fi
            echo "Source-SHA evidence attempt ${source_attempt} is still active."
            sleep 15
          done

          rm -f shared-storage-ga-manifest.md /tmp/shared-storage-ga-manifest.out
          set +e
          python3 tools/shared_storage_ga_manifest.py \
            --repo "${{ github.repository }}" \
            --ref "${RELEASE_SHA}" \
            --evidence-branch "${EVIDENCE_BRANCH}" \
            --output shared-storage-ga-manifest.md \
            > /tmp/shared-storage-ga-manifest.out 2>&1
          status=$?
          set -e
          cat /tmp/shared-storage-ga-manifest.out
          exit "${status}"

      - name: Upload normalized-branch GA manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-storage-immutable-ga-manifest
          path: shared-storage-ga-manifest.md
          if-no-files-found: warn
