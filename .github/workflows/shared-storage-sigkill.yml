name: Shared Storage SIGKILL

on:
  push:
    branches:
      - shared-wal-s3-4.3.1
    paths:
      - 'core/src/test/java/kafka/server/SharedStorageIndependentProcessSigkillTest.java'
      - 'storage/src/main/**'
      - 'storage/shared-storage-s3/**'
      - '.github/workflows/shared-storage-sigkill.yml'
  pull_request:
    paths:
      - 'core/src/test/java/kafka/server/SharedStorageIndependentProcessSigkillTest.java'
      - 'storage/src/main/**'
      - 'storage/shared-storage-s3/**'
      - '.github/workflows/shared-storage-sigkill.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-storage-sigkill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-process-sigkill:
    name: 3 JVM acks=all leader SIGKILL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Start MinIO
        run: |
          docker run --detach \
            --name kafka-shared-minio-sigkill \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadmin123 \
            minio/minio:latest \
            server /data --address :9000

      - name: Wait for MinIO readiness
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs kafka-shared-minio-sigkill
          exit 1

      - name: Ensure MinIO bucket exists
        run: |
          docker run --rm --network host --entrypoint /bin/sh minio/mc:latest -c '
            mc alias set local http://127.0.0.1:9000 minioadmin minioadmin123 >/dev/null &&
            mc mb --ignore-existing local/kafka-shared-storage-sigkill >/dev/null
          '

      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          java-version: 25
          gradle-cache-read-only: true

      - name: Stage independent broker runtime
        shell: bash
        run: |
          set -o pipefail
          ./gradlew \
            :core:jar \
            :core:copyDependantLibs \
            :tools:jar \
            :tools:copyDependantLibs \
            :storage:shared-storage-s3:stageProcessRuntime \
            :core:compileTestJava \
            --no-scan 2>&1 | tee shared-storage-sigkill-build.log
          test -f core/build/libs/kafka_2.13-*.jar || true
          test -d storage/shared-storage-s3/build/process-runtime
          find storage/shared-storage-s3/build/process-runtime -maxdepth 1 -type f -printf '%f\n' | sort \
            > shared-storage-sigkill-runtime.txt
          grep -q '^kafka-shared-storage-s3-' shared-storage-sigkill-runtime.txt
          grep -q '^s3-' shared-storage-sigkill-runtime.txt

      - name: Run independent JVM SIGKILL gate
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin123
          AWS_REGION: us-east-1
          SHARED_STORAGE_S3_ENDPOINT: http://127.0.0.1:9000
          SHARED_STORAGE_S3_REGION: us-east-1
          SHARED_STORAGE_S3_BUCKET: kafka-shared-storage-sigkill
        run: |
          set -o pipefail
          ./gradlew :core:test \
            --tests 'kafka.server.SharedStorageIndependentProcessSigkillTest' \
            --no-scan 2>&1 | tee shared-storage-sigkill-e2e.log
          grep -q 'GATE3_SIGKILL brokerId=' shared-storage-sigkill-e2e.log
          grep -q 'GATE3_RECOVERED oldLeader=' shared-storage-sigkill-e2e.log

      - name: Show committed S3 objects
        if: always()
        run: |
          docker run --rm --network host --entrypoint /bin/sh minio/mc:latest -c '
            mc alias set local http://127.0.0.1:9000 minioadmin minioadmin123 >/dev/null &&
            mc ls --recursive local/kafka-shared-storage-sigkill || true
          ' | tee shared-storage-sigkill-objects.log

      - name: Upload SIGKILL diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-storage-independent-sigkill-log
          path: |
            shared-storage-sigkill-build.log
            shared-storage-sigkill-runtime.txt
            shared-storage-sigkill-e2e.log
            shared-storage-sigkill-objects.log
            core/build/reports/tests/test
            core/build/test-results/test
          if-no-files-found: ignore
          retention-days: 7

      - name: MinIO logs
        if: always()
        run: docker logs kafka-shared-minio-sigkill || true
