name: Shared Storage acks=all Durability Matrix

on:
  push:
    branches:
      - shared-wal-s3-4.3.1
    paths:
      - 'core/src/test/java/kafka/server/SharedStorageIndependentProcessSigkillTest.java'
      - 'storage/src/main/**'
      - 'storage/shared-storage-s3/**'
      - '.github/workflows/shared-storage-sigkill.yml'
  pull_request:
    paths:
      - 'core/src/test/java/kafka/server/SharedStorageIndependentProcessSigkillTest.java'
      - 'storage/src/main/**'
      - 'storage/shared-storage-s3/**'
      - '.github/workflows/shared-storage-sigkill.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-storage-sigkill-${{ github.ref }}
  cancel-in-progress: true

# Each RF case is a separate external-process fault domain and produces independent evidence.
jobs:
  acks-all-replication-matrix:
    name: acks=all RF${{ matrix.rf }} leader SIGKILL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rf:
          - 1
          - 2
          - 3
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Start MinIO
        run: |
          docker run --detach \
            --name kafka-shared-minio-sigkill \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadmin123 \
            minio/minio:latest \
            server /data --address :9000

      - name: Wait for MinIO readiness
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs kafka-shared-minio-sigkill
          exit 1

      - name: Ensure MinIO bucket exists
        run: |
          docker run --rm --network host --entrypoint /bin/sh minio/mc:latest -c '
            mc alias set local http://127.0.0.1:9000 minioadmin minioadmin123 >/dev/null &&
            mc mb --ignore-existing local/kafka-shared-storage-sigkill >/dev/null
          '

      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          java-version: 25
          gradle-cache-read-only: true

      - name: Stage independent broker runtime
        shell: bash
        run: |
          set -o pipefail
          ./gradlew \
            :core:jar \
            :core:copyDependantLibs \
            :tools:jar \
            :tools:copyDependantLibs \
            :storage:shared-storage-s3:stageProcessRuntime \
            :core:compileTestJava \
            --no-scan 2>&1 | tee shared-storage-sigkill-build.log
          test -d storage/shared-storage-s3/build/process-runtime
          find storage/shared-storage-s3/build/process-runtime -maxdepth 1 -type f -printf '%f\n' | sort \
            > shared-storage-sigkill-runtime.txt
          grep -q '^kafka-shared-storage-s3-' shared-storage-sigkill-runtime.txt
          grep -q '^s3-' shared-storage-sigkill-runtime.txt

      - name: Run RF${{ matrix.rf }} independent JVM SIGKILL gate
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin123
          AWS_REGION: us-east-1
          SHARED_STORAGE_S3_ENDPOINT: http://127.0.0.1:9000
          SHARED_STORAGE_S3_REGION: us-east-1
          SHARED_STORAGE_S3_BUCKET: kafka-shared-storage-sigkill
          SHARED_STORAGE_REPLICATION_FACTOR: ${{ matrix.rf }}
        run: |
          set -o pipefail
          ./gradlew :core:test \
            --tests 'kafka.server.SharedStorageIndependentProcessSigkillTest' \
            --no-scan 2>&1 | tee shared-storage-sigkill-e2e.log

          result_xml="$(find core/build/test-results build/junit-xml \
            -type f \
            -name 'TEST-kafka.server.SharedStorageIndependentProcessSigkillTest.xml' \
            -print -quit 2>/dev/null || true)"
          test -n "$result_xml"
          grep -q '<testsuite ' "$result_xml"
          grep -q 'failures="0"' "$result_xml"
          grep -q 'errors="0"' "$result_xml"
          grep -q 'skipped="0"' "$result_xml"
          grep -q 'MATRIX_SCENARIO rf=${{ matrix.rf }} acks=all minIsr=' "$result_xml"
          grep -q 'MATRIX_SIGKILL rf=${{ matrix.rf }} brokerId=' "$result_xml"
          grep -q 'MATRIX_RECOVERED rf=${{ matrix.rf }} mode=' "$result_xml"

          case '${{ matrix.rf }}' in
            1)
              grep -q 'MATRIX_RESTART_REQUIRED rf=1 leader=' "$result_xml"
              grep -q 'MATRIX_RECOVERED rf=1 mode=original-node-restart' "$result_xml"
              ;;
            2)
              grep -q 'MATRIX_FAILOVER_READABLE rf=2 oldLeader=' "$result_xml"
              grep -q 'MATRIX_WRITE_REJECTED_MIN_ISR rf=2 leader=' "$result_xml"
              grep -q 'MATRIX_WRITE_RESUMED rf=2 leader=' "$result_xml"
              grep -q 'MATRIX_RECOVERED rf=2 mode=automatic-failover' "$result_xml"
              ;;
            3)
              grep -q 'MATRIX_FAILOVER_READABLE rf=3 oldLeader=' "$result_xml"
              grep -q 'MATRIX_FAILOVER_WRITABLE rf=3 newLeader=' "$result_xml"
              grep -q 'MATRIX_RECOVERED rf=3 mode=automatic-failover' "$result_xml"
              ;;
          esac

          {
            grep 'MATRIX_SCENARIO rf=${{ matrix.rf }} acks=all minIsr=' "$result_xml"
            grep 'MATRIX_SIGKILL rf=${{ matrix.rf }} brokerId=' "$result_xml"
            grep 'MATRIX_RECOVERED rf=${{ matrix.rf }} mode=' "$result_xml"
            case '${{ matrix.rf }}' in
              1)
                grep 'MATRIX_RESTART_REQUIRED rf=1 leader=' "$result_xml"
                ;;
              2)
                grep 'MATRIX_FAILOVER_READABLE rf=2 oldLeader=' "$result_xml"
                grep 'MATRIX_WRITE_REJECTED_MIN_ISR rf=2 leader=' "$result_xml"
                grep 'MATRIX_WRITE_RESUMED rf=2 leader=' "$result_xml"
                ;;
              3)
                grep 'MATRIX_FAILOVER_READABLE rf=3 oldLeader=' "$result_xml"
                grep 'MATRIX_FAILOVER_WRITABLE rf=3 newLeader=' "$result_xml"
                ;;
            esac
            printf 'MATRIX_SUCCESS rf=%s commit=%s\n' '${{ matrix.rf }}' "$GITHUB_SHA"
          } > shared-storage-sigkill-proof.txt
          cat shared-storage-sigkill-proof.txt

      - name: Show committed S3 objects
        if: always()
        run: |
          docker run --rm --network host --entrypoint /bin/sh minio/mc:latest -c '
            mc alias set local http://127.0.0.1:9000 minioadmin minioadmin123 >/dev/null &&
            mc ls --recursive local/kafka-shared-storage-sigkill || true
          ' | tee shared-storage-sigkill-objects.log

      - name: Upload RF${{ matrix.rf }} SIGKILL diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-storage-acks-all-rf${{ matrix.rf }}-sigkill
          path: |
            shared-storage-sigkill-build.log
            shared-storage-sigkill-runtime.txt
            shared-storage-sigkill-e2e.log
            shared-storage-sigkill-proof.txt
            shared-storage-sigkill-objects.log
            core/build/shared-storage-sigkill-diagnostics
            core/build/reports/tests/test
            core/build/test-results/test
            build/junit-xml/core
          if-no-files-found: ignore
          retention-days: 7

      - name: MinIO logs
        if: always()
        run: docker logs kafka-shared-minio-sigkill || true
