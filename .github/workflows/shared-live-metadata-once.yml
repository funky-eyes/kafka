name: Apply Shared Live Metadata Wiring Once

on:
  push:
    branches:
      - shared-wal-s3-4.3.1
    paths:
      - '.github/workflows/shared-live-metadata-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 200
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for normalized branch head
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            git fetch origin shared-wal-s3-4.3.1 --force
            head=$(git rev-parse origin/shared-wal-s3-4.3.1)
            email=$(git show -s --format='%ae' "$head")
            if [ "$email" = "jianbin@apache.org" ]; then
              git reset --hard "$head"
              exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for author normalization" >&2
          exit 1

      - name: Wire live metadata observer and clean E2E source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old_lines, new_lines):
              p = Path(path)
              text = p.read_text()
              old = "\n".join(old_lines) + "\n"
              new = "\n".join(new_lines) + "\n"
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}")
              p.write_text(text.replace(old, new, 1))

          extension = "storage/shared-storage-s3/src/main/java/org/apache/kafka/storage/internals/shared/s3/S3SharedStorageExtension.java"
          replace_once(
              extension,
              ["import org.apache.kafka.storage.internals.shared.metadata.SharedObjectMetadata;"],
              []
          )
          replace_once(
              extension,
              [
                  "            newMetadataStore = KafkaObjectMetadataStore.open(metadataConfiguration);",
                  "            for (SharedObjectMetadata metadata : newMetadataStore.committedObjects()) {",
                  "                engine.commitRemoteObject(metadata);",
                  "            }"
              ],
              [
                  "            // Initial replay and live commits from every broker update this engine's remote coverage.",
                  "            newMetadataStore = KafkaObjectMetadataStore.open(",
                  "                metadataConfiguration,",
                  "                engine::commitRemoteObject",
                  "            );"
              ]
          )
          replace_once(
              "core/src/test/java/kafka/server/SharedStorageKRaftIntegrationTest.java",
              ["import static org.junit.jupiter.api.Assertions.assertTrue;"],
              []
          )
          PY

          rm .github/workflows/shared-live-metadata-once.yml
          git diff --check
          test "$(grep -c 'engine::commitRemoteObject' storage/shared-storage-s3/src/main/java/org/apache/kafka/storage/internals/shared/s3/S3SharedStorageExtension.java)" -eq 1
          test "$(grep -c 'assertTrue' core/src/test/java/kafka/server/SharedStorageKRaftIntegrationTest.java || true)" -eq 0

      - name: Commit exact patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Jianbin Chen"
          git config user.email "jianbin@apache.org"
          git add storage/shared-storage-s3/src/main/java/org/apache/kafka/storage/internals/shared/s3/S3SharedStorageExtension.java \
                  core/src/test/java/kafka/server/SharedStorageKRaftIntegrationTest.java \
                  .github/workflows/shared-live-metadata-once.yml
          git commit -m "KAFKA-Shared: wire live remote coverage updates"
          git push origin HEAD:shared-wal-s3-4.3.1
