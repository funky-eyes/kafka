name: Shared Storage Object Format Correctness

on:
  push:
    branches:
      - shared-wal-s3-4.3.1
    paths:
      - 'storage/src/main/java/org/apache/kafka/storage/internals/shared/SharedStorageEngine.java'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/shared/object/StreamObjectFormat.java'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/shared/object/SharedObjectPacker.java'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/shared/object/SharedObjectReader.java'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/shared/object/PackedObject.java'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/shared/metadata/SharedObjectMetadata.java'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/shared/metadata/SharedObjectRange.java'
      - 'storage/src/test/java/org/apache/kafka/storage/internals/shared/object/StreamObjectFormatTest.java'
      - 'storage/src/test/java/org/apache/kafka/storage/internals/shared/object/SharedObjectUploaderTest.java'
      - '.github/workflows/shared-storage-object-format.yml'
  pull_request:
    paths:
      - 'storage/src/main/java/org/apache/kafka/storage/internals/shared/SharedStorageEngine.java'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/shared/object/StreamObjectFormat.java'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/shared/object/SharedObjectPacker.java'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/shared/object/SharedObjectReader.java'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/shared/object/PackedObject.java'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/shared/metadata/SharedObjectMetadata.java'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/shared/metadata/SharedObjectRange.java'
      - 'storage/src/test/java/org/apache/kafka/storage/internals/shared/object/StreamObjectFormatTest.java'
      - 'storage/src/test/java/org/apache/kafka/storage/internals/shared/object/SharedObjectUploaderTest.java'
      - '.github/workflows/shared-storage-object-format.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-storage-object-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  object-format-correctness:
    name: Stream object pack, index, footer, and corruption gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          java-version: 25
          gradle-cache-read-only: true

      - name: Run stream object correctness tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :storage:test \
            --tests 'org.apache.kafka.storage.internals.shared.object.StreamObjectFormatTest' \
            --tests 'org.apache.kafka.storage.internals.shared.object.SharedObjectUploaderTest' \
            --no-scan 2>&1 | tee shared-storage-object-format.log

          result_dir='storage/build/test-results/test'
          test -f "$result_dir/TEST-org.apache.kafka.storage.internals.shared.object.StreamObjectFormatTest.xml"
          test -f "$result_dir/TEST-org.apache.kafka.storage.internals.shared.object.SharedObjectUploaderTest.xml"
          if grep -E 'failures="[1-9]|errors="[1-9]|skipped="[1-9]' \
              "$result_dir/TEST-org.apache.kafka.storage.internals.shared.object.StreamObjectFormatTest.xml" \
              "$result_dir/TEST-org.apache.kafka.storage.internals.shared.object.SharedObjectUploaderTest.xml"; then
            exit 1
          fi
          printf 'OBJECT_FORMAT_CORRECTNESS_SUCCESS commit=%s\n' "$GITHUB_SHA" \
            | tee shared-storage-object-format-proof.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-storage-object-format-log
          path: |
            shared-storage-object-format.log
            shared-storage-object-format-proof.txt
            storage/build/reports/tests/test
            storage/build/test-results/test
            storage/build/reports/checkstyle
          if-no-files-found: ignore
          retention-days: 7
