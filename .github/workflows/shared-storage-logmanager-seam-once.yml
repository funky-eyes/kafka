name: Apply Shared LogManager Seam Once

on:
  push:
    branches:
      - shared-wal-s3-4.3.1
    paths:
      - '.github/workflows/shared-storage-logmanager-seam-once.yml'

permissions:
  contents: write

jobs:
  apply-seam:
    if: github.event.head_commit.message == 'KAFKA-Shared: add one-shot LogManager factory seam patch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Patch LogManager creation seam
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('core/src/main/scala/kafka/log/LogManager.scala')
          text = path.read_text()

          old_import = "import org.apache.kafka.storage.internals.log.{CleanerConfig, LogCleaner, LogConfig, LogDirFailureChannel, LogManager => JLogManager, LogOffsetsListener, ProducerStateManagerConfig, RemoteIndexCache, UnifiedLog}"
          new_import = "import org.apache.kafka.storage.internals.log.{CleanerConfig, LogCleaner, LogConfig, LogDirFailureChannel, LogManager => JLogManager, LogOffsetsListener, ProducerStateManagerConfig, RemoteIndexCache, UnifiedLog, UnifiedLogCreationContext, UnifiedLogFactory}"
          assert text.count(old_import) == 1, 'unexpected LogManager storage import shape'
          text = text.replace(old_import, new_import)

          anchor = """  @volatile private var _cleaner: LogCleaner = _
          private[kafka] def cleaner: LogCleaner = _cleaner
          """
          replacement = """  @volatile private var _cleaner: LogCleaner = _
          private[kafka] def cleaner: LogCleaner = _cleaner

          @volatile private var unifiedLogFactory: UnifiedLogFactory = UnifiedLogFactory.DEFAULT
          @volatile private var unifiedLogFactoryFrozen = false

          /**
           * Installs a log factory before the first log is created or loaded. The default factory is Kafka's original
           * UnifiedLog.create path, so classic storage behavior remains unchanged unless an extension explicitly injects
           * another implementation before startup.
           */
          def setUnifiedLogFactory(factory: UnifiedLogFactory): Unit = this.synchronized {
            if (factory == null)
              throw new NullPointerException("factory")
            if (unifiedLogFactoryFrozen)
              throw new IllegalStateException("UnifiedLogFactory cannot be changed after log creation has started")
            unifiedLogFactory = factory
          }

          private def createUnifiedLog(context: UnifiedLogCreationContext): UnifiedLog = {
            val factory = this.synchronized {
              unifiedLogFactoryFrozen = true
              unifiedLogFactory
            }
            factory.create(context)
          }
          """
          assert text.count(anchor) == 1, 'unexpected cleaner field anchor'
          text = text.replace(anchor, replacement)

          old_load = """    val log = UnifiedLog.create(
            logDir,
            config,
            logStartOffset,
            logRecoveryPoint,
            scheduler,
            brokerTopicStats,
            time,
            maxTransactionTimeoutMs,
            producerStateManagerConfig,
            producerIdExpirationCheckIntervalMs,
            logDirFailureChannel,
            hadCleanShutdown,
            Optional.empty,
            numRemainingSegments,
            remoteStorageSystemEnable,
            LogOffsetsListener.NO_OP_OFFSETS_LISTENER)
          """
          new_load = """    val log = createUnifiedLog(new UnifiedLogCreationContext(
            logDir,
            config,
            logStartOffset,
            logRecoveryPoint,
            scheduler,
            brokerTopicStats,
            time,
            maxTransactionTimeoutMs,
            producerStateManagerConfig,
            producerIdExpirationCheckIntervalMs,
            logDirFailureChannel,
            hadCleanShutdown,
            Optional.empty,
            numRemainingSegments,
            remoteStorageSystemEnable,
            LogOffsetsListener.NO_OP_OFFSETS_LISTENER))
          """
          assert text.count(old_load) == 1, 'startup load UnifiedLog.create block changed'
          text = text.replace(old_load, new_load)

          old_create = """        val log = UnifiedLog.create(
            logDir,
            config,
            0L,
            0L,
            scheduler,
            brokerTopicStats,
            time,
            maxTransactionTimeoutMs,
            producerStateManagerConfig,
            producerIdExpirationCheckIntervalMs,
            logDirFailureChannel,
            true,
            topicId,
            new ConcurrentHashMap[String, Integer](),
            remoteStorageSystemEnable,
            LogOffsetsListener.NO_OP_OFFSETS_LISTENER)
          """
          new_create = """        val log = createUnifiedLog(new UnifiedLogCreationContext(
            logDir,
            config,
            0L,
            0L,
            scheduler,
            brokerTopicStats,
            time,
            maxTransactionTimeoutMs,
            producerStateManagerConfig,
            producerIdExpirationCheckIntervalMs,
            logDirFailureChannel,
            true,
            topicId,
            new ConcurrentHashMap[String, Integer](),
            remoteStorageSystemEnable,
            LogOffsetsListener.NO_OP_OFFSETS_LISTENER))
          """
          assert text.count(old_create) == 1, 'new log UnifiedLog.create block changed'
          text = text.replace(old_create, new_create)

          if 'UnifiedLog.create(' in text:
            raise AssertionError('unexpected direct UnifiedLog.create remains in LogManager.scala')

          path.write_text(text)
          PY

          git diff --check
          git diff -- core/src/main/scala/kafka/log/LogManager.scala

      - name: Commit seam
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(git status --porcelain core/src/main/scala/kafka/log/LogManager.scala)"
          git config user.name 'Jianbin Chen'
          git config user.email 'jianbin@apache.org'
          git add core/src/main/scala/kafka/log/LogManager.scala
          git commit -m 'KAFKA-Shared: route log creation through factory seam'
          git push origin "HEAD:${GITHUB_REF_NAME}"
