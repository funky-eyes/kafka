name: Shared WAL JMH Compile

on:
  pull_request:
    paths:
      - 'jmh-benchmarks/src/main/java/org/apache/kafka/jmh/storage/SharedWalDurabilityBench.java'
      - '.github/workflows/shared-storage-wal-jmh-compile.yml'
      - 'build.gradle'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-storage-wal-jmh-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-wal-jmh:
    name: Java 25 WAL JMH compilation and Checkstyle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          java-version: 25
          gradle-cache-read-only: true

      - name: Compile JMH sources and check style
        run: ./gradlew :jmh-benchmarks:compileJava :jmh-benchmarks:checkstyleMain --no-scan
