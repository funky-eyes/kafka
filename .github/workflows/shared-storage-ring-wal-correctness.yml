name: Shared Storage Ring WAL Correctness

on:
  push:
    branches:
      - shared-wal-s3-4.3.1
    paths:
      - 'storage/src/main/java/org/apache/kafka/storage/internals/shared/wal/**'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/shared/kafka/SharedStorageConfiguration.java'
      - 'storage/src/test/java/org/apache/kafka/storage/internals/shared/wal/Ring*Test.java'
      - 'storage/shared-storage-s3/src/main/java/org/apache/kafka/storage/internals/shared/s3/S3SharedStorageExtension.java'
      - 'storage/shared-storage-s3/src/test/java/org/apache/kafka/storage/internals/shared/s3/S3SharedStorageWalFactoryTest.java'
      - '.github/workflows/shared-storage-ring-wal-correctness.yml'
  pull_request:
    paths:
      - 'storage/src/main/java/org/apache/kafka/storage/internals/shared/wal/**'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/shared/kafka/SharedStorageConfiguration.java'
      - 'storage/src/test/java/org/apache/kafka/storage/internals/shared/wal/Ring*Test.java'
      - 'storage/shared-storage-s3/src/main/java/org/apache/kafka/storage/internals/shared/s3/S3SharedStorageExtension.java'
      - 'storage/shared-storage-s3/src/test/java/org/apache/kafka/storage/internals/shared/s3/S3SharedStorageWalFactoryTest.java'
      - '.github/workflows/shared-storage-ring-wal-correctness.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-storage-ring-wal-correctness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ring-wal-correctness:
    name: Ring WAL crash, wrap, reclaim, and recovery gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          java-version: 25
          gradle-cache-read-only: true

      - name: Run Ring WAL correctness tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :storage:test \
            --tests 'org.apache.kafka.storage.internals.shared.wal.RingWalLayoutTest' \
            --tests 'org.apache.kafka.storage.internals.shared.wal.RingWalSuperblockTest' \
            --tests 'org.apache.kafka.storage.internals.shared.wal.RingWalFileTest' \
            --tests 'org.apache.kafka.storage.internals.shared.wal.RingSharedWal*Test' \
            --no-scan 2>&1 | tee shared-storage-ring-wal-correctness.log

          ./gradlew :storage:shared-storage-s3:test \
            --tests 'org.apache.kafka.storage.internals.shared.s3.S3SharedStorageWalFactoryTest' \
            --no-scan 2>&1 | tee -a shared-storage-ring-wal-correctness.log

          storage_result_dir='storage/build/test-results/test'
          s3_result_dir='storage/shared-storage-s3/build/test-results/test'
          test -d "$storage_result_dir"
          test -d "$s3_result_dir"
          test "$(find "$storage_result_dir" -name 'TEST-org.apache.kafka.storage.internals.shared.wal.Ring*Test.xml' | wc -l)" -ge 6
          test -f "$s3_result_dir/TEST-org.apache.kafka.storage.internals.shared.s3.S3SharedStorageWalFactoryTest.xml"
          if grep -R -E 'failures="[1-9]|errors="[1-9]|skipped="[1-9]' \
              "$storage_result_dir"/TEST-org.apache.kafka.storage.internals.shared.wal.Ring*Test.xml \
              "$s3_result_dir/TEST-org.apache.kafka.storage.internals.shared.s3.S3SharedStorageWalFactoryTest.xml; then
            exit 1
          fi
          printf 'RING_WAL_CORRECTNESS_SUCCESS commit=%s\n' "$GITHUB_SHA" | tee shared-storage-ring-wal-proof.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-storage-ring-wal-correctness-log
          path: |
            shared-storage-ring-wal-correctness.log
            shared-storage-ring-wal-proof.txt
            storage/build/reports/tests/test
            storage/build/test-results/test
            storage/shared-storage-s3/build/reports/tests/test
            storage/shared-storage-s3/build/test-results/test
          if-no-files-found: ignore
          retention-days: 7
