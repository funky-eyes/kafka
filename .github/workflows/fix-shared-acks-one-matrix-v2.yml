name: Fix Shared Storage acks=1 Matrix v2

on:
  push:
    branches:
      - shared-wal-s3-4.3.1
    paths:
      - '.github/workflows/fix-shared-acks-one-matrix-v2.yml'

permissions:
  contents: write

concurrency:
  group: fix-shared-acks-one-matrix-v2
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest branch
        uses: actions/checkout@v5
        with:
          ref: shared-wal-s3-4.3.1
          fetch-depth: 0
          persist-credentials: true

      - name: Apply correction
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin shared-wal-s3-4.3.1
          git reset --hard origin/shared-wal-s3-4.3.1

          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/shared-storage-acks-one.yml')
          text = workflow.read_text()
          text = text.replace('matrix.replication-factor', 'matrix.rf')
          text = text.replace('replication-factor:', 'rf:')
          workflow.write_text(text)

          test = Path('core/src/test/java/kafka/server/SharedStorageAcksOneKRaftIntegrationTest.java')
          source = test.read_text()
          source = source.replace(
              'import static org.junit.jupiter.api.Assertions.assertTrue;\n',
              ''
          )
          test.write_text(source)
          PY

          grep -q 'matrix.rf' .github/workflows/shared-storage-acks-one.yml
          grep -q '^        rf:$' .github/workflows/shared-storage-acks-one.yml
          grep -q 'ACKS_ONE_SCENARIO' \
            core/src/test/java/kafka/server/SharedStorageAcksOneKRaftIntegrationTest.java
          ! grep -q 'Assertions.assertTrue' \
            core/src/test/java/kafka/server/SharedStorageAcksOneKRaftIntegrationTest.java

          rm -f \
            .github/workflows/fix-shared-acks-one-matrix.yml \
            .github/workflows/fix-shared-acks-one-matrix-v2.yml

      - name: Commit and rebase over concurrent normalization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Jianbin Chen'
          git config user.email 'jianbin@apache.org'
          git add -A
          git commit -m 'KAFKA-Shared: make acks=1 matrix expressions valid'

          git fetch origin shared-wal-s3-4.3.1
          git rebase origin/shared-wal-s3-4.3.1
          git push origin HEAD:shared-wal-s3-4.3.1
