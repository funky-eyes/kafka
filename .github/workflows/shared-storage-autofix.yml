name: Shared Storage One-shot Compile Fix

on:
  push:
    branches:
      - shared-wal-s3-4.3.1
    paths:
      - '.github/workflows/shared-storage-autofix.yml'

permissions:
  contents: write

jobs:
  patch-and-remove-self:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Apply compile fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('core/src/test/java/kafka/server/SharedStorageIndependentProcessSigkillTest.java')
          text = path.read_text(encoding='utf-8')
          old = '''            () -> "Expected a minISR rejection but received: " + failure
'''
          new = '''            "Expected a minISR rejection but received: " + failure
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one compile-fix target, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          rm .github/workflows/shared-storage-autofix.yml
          git config user.name 'Jianbin Chen'
          git config user.email 'jianbin@apache.org'
          git add core/src/test/java/kafka/server/SharedStorageIndependentProcessSigkillTest.java \
            .github/workflows/shared-storage-autofix.yml
          git commit -m 'KAFKA-Shared: fix durability matrix compile assertion'
          git push origin "HEAD:${GITHUB_REF_NAME}"
