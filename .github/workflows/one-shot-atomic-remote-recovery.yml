name: One-shot atomic remote recovery fix

on:
  push:
    branches:
      - shared-wal-s3-4.3.1
    paths:
      - .github/workflows/one-shot-atomic-remote-recovery.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: shared-wal-s3-4.3.1

      - name: Materialize remote recovery before publishing LEO
        shell: bash
        run: |
          set -euo pipefail
          branch='shared-wal-s3-4.3.1'
          base='1c78ce88b44e6a81873cf454ee39215150a00051'
          workflow='.github/workflows/one-shot-atomic-remote-recovery.yml'
          git fetch origin "$branch"
          current="$(git rev-parse "origin/$branch")"
          unexpected="$(git diff --name-only "$base" "$current" | grep -v -x "$workflow" || true)"
          if [ -n "$unexpected" ]; then
            echo 'Branch changed outside temporary workflow:'
            printf '%s\n' "$unexpected"
            exit 1
          fi
          git checkout --detach "$base"

          python3 - <<'PY'
          from pathlib import Path
          p = Path('storage/src/main/java/org/apache/kafka/storage/internals/shared/kafka/SharedUnifiedLogFactory.java')
          s = p.read_text()
          old = '''                if (committedEnd > currentEnd) {
                    loaded.localLog().updateLogEndOffset(committedEnd);
                }
                recoveries.add(new RemoteRecovery(loaded, logStartOffset, committedEnd));'''
          new = '''                recoveries.add(new RemoteRecovery(loaded, logStartOffset, committedEnd));'''
          if s.count(old) != 1:
              raise SystemExit(f'early LEO publication anchor count={s.count(old)}')
          s = s.replace(old, new, 1)

          old_comment = '''        // Phase 1 is metadata-only and intentionally fast for all partitions. A follower fetch response may already be
        // in flight at the old LEO; ReplicaFetcherThread recognizes that shared-storage recovery advanced the LEO and
        // re-seeds its cursor instead of appending the stale response into the WAL.'''
          new_comment = '''        // Phase 1 is metadata-only and intentionally does not publish the recovered LEO. Publishing an LEO before
        // SharedLogSegment has materialized its remote batch/index view can let Kafka admit the replica to ISR and elect
        // it leader while historical reads are still incomplete. Follower WAL-capacity pressure is retryable during this
        // window; after phase 2 publishes the rebuilt LEO, ReplicaFetcherThread re-seeds any stale fetch cursor.'''
          if s.count(old_comment) != 1:
              raise SystemExit(f'phase comment anchor count={s.count(old_comment)}')
          s = s.replace(old_comment, new_comment, 1)

          old_doc = '''     * logical end offset for every affected partition without doing S3 I/O. This prevents follower fetchers from
     * replaying an already-remotely-committed history into the bounded WAL while another partition is still rebuilding.
     * A second pass then reopens the logical segments against the populated remote index, rebuilds Kafka's producer and
     * leader-epoch compatibility state, and exposes only the contiguous remotely committed prefix through the high
     * watermark.</p>'''
          new_doc = '''     * recovery plan for every affected partition without mutating Kafka-visible offsets. A second pass reopens the
     * logical segments against the populated remote index and rebuilds Kafka's producer and leader-epoch compatibility
     * state before publishing the reconstructed LEO/high watermark. This prevents a replica from joining ISR or becoming
     * leader with an offset that its SharedLogSegment read view cannot yet serve.</p>'''
          if s.count(old_doc) != 1:
              raise SystemExit(f'javadoc anchor count={s.count(old_doc)}')
          s = s.replace(old_doc, new_doc, 1)
          p.write_text(s)
          PY

          git diff --check
          ./gradlew :storage:compileJava :storage:test --tests 'org.apache.kafka.storage.internals.shared.kafka.SharedUnifiedLogFactoryTest' --no-daemon --no-scan
          git add storage/src/main/java/org/apache/kafka/storage/internals/shared/kafka/SharedUnifiedLogFactory.java
          git -c user.name='Jianbin Chen' -c user.email='jianbin@apache.org' commit \
            -m 'KAFKA-XXXX: publish recovered LEO after remote view rebuild'

          git fetch origin "$branch"
          lease="$(git rev-parse "origin/$branch")"
          unexpected="$(git diff --name-only "$base" "$lease" | grep -v -x "$workflow" || true)"
          if [ -n "$unexpected" ]; then
            echo 'Branch changed while validating recovery fix:'
            printf '%s\n' "$unexpected"
            exit 1
          fi
          git push origin "HEAD:refs/heads/$branch" --force-with-lease="refs/heads/$branch:$lease"
