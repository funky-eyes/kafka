name: Shared Storage GC Concurrency JMH

on:
  pull_request:
    paths:
      - 'jmh-benchmarks/src/main/java/org/apache/kafka/storage/internals/shared/object/**'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/shared/object/ActiveCommittedObjectReads.java'
      - '.github/workflows/shared-storage-gc-jmh.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reader-fences:
    name: Java 25 reader-fence contention throughput
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup isolated Java and Gradle
        uses: ./.github/actions/setup-gradle
        with:
          java-version: 25
          gradle-cache-read-only: true

      - name: Build official Kafka JMH harness
        run: ./gradlew :jmh-benchmarks:shadowJar --no-scan --max-workers=2

      - name: Measure 1-key contention and independent 1024-key admission
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(jmh-benchmarks/build/libs/kafka-jmh-benchmarks-*-all.jar)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one JMH shadow JAR" >&2
            exit 1
          fi
          java -jar "${jars[0]}" '.*ActiveCommittedObjectReadsBenchmark.*' \
            -f 1 -wi 2 -w 2s -i 3 -r 2s -t 8 -prof gc \
            -rf json -rff shared-storage-gc-lease-jmh.json | tee shared-storage-gc-lease-jmh.log

      - name: Publish raw machine-readable JMH and allocation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-storage-gc-lease-jmh
          path: |
            shared-storage-gc-lease-jmh.json
            shared-storage-gc-lease-jmh.log
          if-no-files-found: warn
