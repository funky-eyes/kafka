name: Apply Shared E2E WAL Path Once

on:
  push:
    branches:
      - shared-wal-s3-4.3.1
    paths:
      - '.github/workflows/shared-e2e-path-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 200
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for normalized branch head
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            git fetch origin shared-wal-s3-4.3.1 --force
            head=$(git rev-parse origin/shared-wal-s3-4.3.1)
            email=$(git show -s --format='%ae' "$head")
            if [ "$email" = "jianbin@apache.org" ]; then
              git reset --hard "$head"
              exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for author normalization" >&2
          exit 1

      - name: Update E2E paths without weakening assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("core/src/test/java/kafka/server/SharedStorageKRaftIntegrationTest.java")
          source = path.read_text()
          bootstrap_call = "cluster.bootstrapServers()"
          count = source.count(bootstrap_call)
          if count != 5:
              raise SystemExit(f"expected five bootstrapServers calls, got {count}")
          source = source.replace(bootstrap_call, "bootstrapServers")

          ready = "            cluster.waitForReadyBrokers();\n\n"
          replacement = ready + "            String bootstrapServers = cluster.bootstrapServers();\n\n"
          if source.count(ready) != 1:
              raise SystemExit("expected cluster ready anchor once")
          source = source.replace(ready, replacement, 1)

          old_wal = "\n".join([
              "            Path dataDir = Path.of(broker.getValue().logDataDirectories().iterator().next());",
              "            Path walDir = dataDir.resolve(\".shared-storage\").resolve(\"broker-\" + brokerId).resolve(\"wal\");"
          ])
          new_wal = "\n".join([
              "            Path dataDir = Path.of(broker.getValue().logDataDirectories().iterator().next())",
              "                .toAbsolutePath()",
              "                .normalize();",
              "            Path walDir = dataDir",
              "                .resolveSibling(dataDir.getFileName() + \".shared-storage\")",
              "                .resolve(\"broker-\" + brokerId)",
              "                .resolve(\"wal\");"
          ])
          if source.count(old_wal) != 1:
              raise SystemExit("expected old WAL path block once")
          source = source.replace(old_wal, new_wal, 1)
          path.write_text(source)
          PY

          rm .github/workflows/shared-e2e-path-once.yml
          git diff --check
          test "$(grep -c 'String bootstrapServers = cluster.bootstrapServers();' core/src/test/java/kafka/server/SharedStorageKRaftIntegrationTest.java)" -eq 1
          test "$(grep -c 'resolveSibling(dataDir.getFileName() + ".shared-storage")' core/src/test/java/kafka/server/SharedStorageKRaftIntegrationTest.java)" -eq 1

      - name: Commit exact patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Jianbin Chen"
          git config user.email "jianbin@apache.org"
          git add core/src/test/java/kafka/server/SharedStorageKRaftIntegrationTest.java \
                  .github/workflows/shared-e2e-path-once.yml
          git commit -m "KAFKA-Shared: align failover E2E with isolated WAL root"
          git push origin HEAD:shared-wal-s3-4.3.1
