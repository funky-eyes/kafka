name: Shared Storage Local State Loss Recovery

on:
  push:
    branches:
      - shared-wal-s3-4.3.1
    paths:
      - 'storage/src/main/java/org/apache/kafka/storage/internals/shared/**'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/log/**'
      - 'storage/src/test/java/org/apache/kafka/storage/internals/shared/kafka/SharedLogSegmentRemoteRecoveryTest.java'
      - 'storage/src/test/java/org/apache/kafka/storage/internals/shared/kafka/SharedUnifiedLogFactoryTest.java'
      - 'storage/shared-storage-s3/**'
      - 'core/src/main/scala/kafka/cluster/Partition.scala'
      - 'core/src/main/scala/kafka/log/LogManager.scala'
      - 'core/src/main/scala/kafka/server/BrokerServer.scala'
      - 'core/src/main/scala/kafka/server/ReplicaManager.scala'
      - 'core/src/main/scala/kafka/server/ReplicaFetcherManager.scala'
      - 'core/src/main/scala/kafka/server/ReplicaFetcherThread.scala'
      - 'core/src/main/scala/kafka/server/AbstractFetcherThread.scala'
      - 'core/src/main/java/kafka/server/builders/LogManagerBuilder.java'
      - 'core/src/test/scala/unit/kafka/server/AbstractFetcherThreadTest.scala'
      - 'core/src/test/scala/unit/kafka/server/AbstractFetcherThreadRecoveredOffsetTest.scala'
      - 'core/src/test/scala/unit/kafka/server/ReplicaFetcherManagerShutdownTest.scala'
      - 'core/src/test/scala/unit/kafka/server/ReplicaFetcherThreadTest.scala'
      - 'core/src/test/scala/unit/kafka/server/ReplicaFetcherThreadRecoveryTest.scala'
      - 'core/src/test/java/kafka/server/SharedStorageLocalStateLossE2ETest.java'
      - 'core/src/test/java/kafka/server/SharedStorageRemoteCheckpointLossE2ETest.java'
      - '.github/workflows/shared-storage-local-state-loss.yml'
      - '.github/workflows/shared-storage-upload-crash.yml'
  pull_request:
    paths:
      - 'storage/src/main/java/org/apache/kafka/storage/internals/shared/**'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/log/**'
      - 'storage/src/test/java/org/apache/kafka/storage/internals/shared/kafka/SharedLogSegmentRemoteRecoveryTest.java'
      - 'storage/src/test/java/org/apache/kafka/storage/internals/shared/kafka/SharedUnifiedLogFactoryTest.java'
      - 'storage/shared-storage-s3/**'
      - 'core/src/main/scala/kafka/cluster/Partition.scala'
      - 'core/src/main/scala/kafka/log/LogManager.scala'
      - 'core/src/main/scala/kafka/server/BrokerServer.scala'
      - 'core/src/main/scala/kafka/server/ReplicaManager.scala'
      - 'core/src/main/scala/kafka/server/ReplicaFetcherManager.scala'
      - 'core/src/main/scala/kafka/server/ReplicaFetcherThread.scala'
      - 'core/src/main/scala/kafka/server/AbstractFetcherThread.scala'
      - 'core/src/main/java/kafka/server/builders/LogManagerBuilder.java'
      - 'core/src/test/scala/unit/kafka/server/AbstractFetcherThreadTest.scala'
      - 'core/src/test/scala/unit/kafka/server/AbstractFetcherThreadRecoveredOffsetTest.scala'
      - 'core/src/test/scala/unit/kafka/server/ReplicaFetcherManagerShutdownTest.scala'
      - 'core/src/test/scala/unit/kafka/server/ReplicaFetcherThreadTest.scala'
      - 'core/src/test/scala/unit/kafka/server/ReplicaFetcherThreadRecoveryTest.scala'
      - 'core/src/test/java/kafka/server/SharedStorageLocalStateLossE2ETest.java'
      - 'core/src/test/java/kafka/server/SharedStorageRemoteCheckpointLossE2ETest.java'
      - '.github/workflows/shared-storage-local-state-loss.yml'
      - '.github/workflows/shared-storage-upload-crash.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-storage-local-state-loss-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-state-loss-recovery:
    name: Rebuild all broker shared state from metadata and S3
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Start MinIO
        run: |
          docker run --detach \
            --name kafka-shared-local-state-loss-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadmin123 \
            minio/minio:latest \
            server /data --address :9000

      - name: Wait for MinIO readiness
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs kafka-shared-local-state-loss-minio
          exit 1

      - name: Ensure MinIO bucket exists
        run: |
          docker run --rm --network host --entrypoint /bin/sh minio/mc:latest -c '
            mc alias set local http://127.0.0.1:9000 minioadmin minioadmin123 >/dev/null &&
            mc mb --ignore-existing local/kafka-shared-storage-local-state-loss >/dev/null
          '

      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          java-version: 25
          gradle-cache-read-only: true

      - name: Verify remote recovery and fetcher recovery invariants
        run: |
          ./gradlew :storage:test \
            --tests 'org.apache.kafka.storage.internals.shared.kafka.SharedLogSegmentRemoteRecoveryTest' \
            --tests 'org.apache.kafka.storage.internals.shared.kafka.SharedUnifiedLogFactoryTest' \
            --no-scan
          ./gradlew :core:test \
            --tests 'kafka.server.ReplicaFetcherThreadRecoveryTest' \
            --tests 'kafka.server.AbstractFetcherThreadRecoveredOffsetTest' \
            --tests 'kafka.server.ReplicaFetcherManagerShutdownTest' \
            --tests 'kafka.server.AbstractFetcherThreadTest.testFencedFetch' \
            --tests 'kafka.server.AbstractFetcherThreadTest.testFencedTruncation' \
            --no-scan

      - name: Enable focused local-state-loss state-machine diagnostics
        run: |
          printf '%s\n' \
            '      - name: kafka.server.ReplicaFetcherThread' \
            '        level: INFO' \
            '      - name: kafka.server.AbstractFetcherThread' \
            '        level: INFO' \
            '      - name: state.change.logger' \
            '        level: INFO' \
            '      - name: org.apache.kafka.storage.internals.shared' \
            '        level: INFO' \
            >> core/src/test/resources/log4j2.yaml

      - name: Recover from complete local loss and checkpoint-only loss
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin123
          AWS_REGION: us-east-1
          SHARED_STORAGE_S3_ENDPOINT: http://127.0.0.1:9000
          SHARED_STORAGE_S3_REGION: us-east-1
          SHARED_STORAGE_S3_BUCKET: kafka-shared-storage-local-state-loss
          SHARED_STORAGE_S3_CONTAINER: kafka-shared-local-state-loss-minio
        run: |
          set +e
          set -o pipefail
          ./gradlew :core:test \
            --tests 'kafka.server.SharedStorageLocalStateLossE2ETest' \
            --no-scan 2>&1 | tee shared-storage-local-state-loss.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo '===== SharedStorageLocalStateLossE2ETest stdout ====='
            find core/build/reports/testOutput -type f -name '*.stdout' -print -exec cat {} \; 2>/dev/null || true
            exit "$status"
          fi

          ./gradlew :core:test \
            --tests 'kafka.server.SharedStorageRemoteCheckpointLossE2ETest' \
            --no-scan 2>&1 | tee shared-storage-remote-checkpoint-loss.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo '===== SharedStorageRemoteCheckpointLossE2ETest stdout ====='
            find core/build/reports/testOutput -type f -name '*.stdout' -print -exec cat {} \; 2>/dev/null || true
            exit "$status"
          fi
          set -e

          result_xml="$(find core/build/test-results build/junit-xml \
            -type f \
            -name 'TEST-kafka.server.SharedStorageRemoteCheckpointLossE2ETest.xml' \
            -print -quit 2>/dev/null || true)"
          test -n "$result_xml"
          grep -q '<testsuite ' "$result_xml"
          grep -q 'failures="0"' "$result_xml"
          grep -q 'errors="0"' "$result_xml"
          grep -q 'skipped="0"' "$result_xml"
          grep -q 'clusterRecoversRemotePrefixWhenCheckpointIsLostButWalTailSurvives' "$result_xml"

          grep 'REMOTE_CHECKPOINT_LOSS_' "$result_xml" \
            | tee shared-storage-remote-checkpoint-loss-proof.txt
          grep -q 'REMOTE_CHECKPOINT_LOSS_WAL_TAIL_ACKED' shared-storage-remote-checkpoint-loss-proof.txt
          grep -q 'REMOTE_CHECKPOINT_LOSS_WAL_PRESERVED' shared-storage-remote-checkpoint-loss-proof.txt
          grep -q 'REMOTE_CHECKPOINT_LOSS_RECOVERED' shared-storage-remote-checkpoint-loss-proof.txt

      - name: Show recovered S3 objects
        if: always()
        run: |
          docker start kafka-shared-local-state-loss-minio >/dev/null 2>&1 || true
          docker run --rm --network host --entrypoint /bin/sh minio/mc:latest -c '
            mc alias set local http://127.0.0.1:9000 minioadmin minioadmin123 >/dev/null &&
            mc ls --recursive local/kafka-shared-storage-local-state-loss || true
          ' | tee shared-storage-local-state-loss-objects.log

      - name: Upload local-state-loss diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-storage-local-state-loss
          path: |
            shared-storage-local-state-loss.log
            shared-storage-remote-checkpoint-loss.log
            shared-storage-remote-checkpoint-loss-proof.txt
            shared-storage-local-state-loss-objects.log
            core/build/reports/testOutput
            core/build/reports/tests/test
            core/build/test-results/test
            storage/build/reports/tests/test
            storage/build/test-results/test
          if-no-files-found: ignore
          retention-days: 7

      - name: MinIO logs
        if: always()
        run: docker logs kafka-shared-local-state-loss-minio || true
