name: Shared Storage GA Workflow Consistency

on:
  push:
    branches:
      - shared-wal-s3-4.3.1
    paths:
      - '.github/workflows/shared-storage*.yml'
      - 'tools/shared_storage_ga_manifest.py'
      - 'tools/shared_storage_ga_source_runs.py'
      - 'tools/check_shared_storage_ga_workflows.py'
      - 'tools/test_shared_storage_ga_manifest.py'
      - 'tools/test_check_shared_storage_ga_workflows.py'
      - 'tools/promote_shared_storage_real_s3_evidence.py'
      - 'tools/test_promote_shared_storage_real_s3_evidence.py'
      - '.github/actions/setup-minio/**'
      - 'tools/shared_storage_minio_fixture.sh'
      - 'tools/test_shared_storage_minio_fixture.sh'
  pull_request:
    paths:
      - '.github/workflows/shared-storage*.yml'
      - 'tools/shared_storage_ga_manifest.py'
      - 'tools/shared_storage_ga_source_runs.py'
      - 'tools/check_shared_storage_ga_workflows.py'
      - 'tools/test_shared_storage_ga_manifest.py'
      - 'tools/test_check_shared_storage_ga_workflows.py'
      - 'tools/promote_shared_storage_real_s3_evidence.py'
      - 'tools/test_promote_shared_storage_real_s3_evidence.py'
      - '.github/actions/setup-minio/**'
      - 'tools/shared_storage_minio_fixture.sh'
      - 'tools/test_shared_storage_minio_fixture.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-ga-workflow-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Test GA manifest evidence rules
        run: python3 tools/test_shared_storage_ga_manifest.py

      - name: Check GA source-run waiter syntax
        run: python3 -m py_compile tools/shared_storage_ga_source_runs.py

      - name: Test Real S3 evidence promotion rules
        run: python3 tools/test_promote_shared_storage_real_s3_evidence.py

      - name: Test GA workflow checker rules
        run: python3 tools/test_check_shared_storage_ga_workflows.py

      - name: Test MinIO fixture process ownership
        run: bash tools/test_shared_storage_minio_fixture.sh

      - name: Validate Shared Storage GA workflow graph
        run: python3 tools/check_shared_storage_ga_workflows.py
