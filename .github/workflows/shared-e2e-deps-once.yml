name: Apply Shared E2E Test Runtime Once

on:
  push:
    branches:
      - shared-wal-s3-4.3.1
    paths:
      - '.github/workflows/shared-e2e-deps-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 200
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for normalized branch head
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            git fetch origin shared-wal-s3-4.3.1 --force
            head=$(git rev-parse origin/shared-wal-s3-4.3.1)
            email=$(git show -s --format='%ae' "$head")
            if [ "$email" = "jianbin@apache.org" ]; then
              git reset --hard "$head"
              exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for author normalization" >&2
          exit 1

      - name: Add isolated S3 runtime to core integration tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          build = Path("build.gradle")
          text = build.read_text()
          anchor = "    testImplementation libs.mockOAuth2Server\n\n    testRuntimeOnly runtimeTestLibs\n"
          replacement = "    testImplementation libs.mockOAuth2Server\n\n    testRuntimeOnly project(':storage:shared-storage-s3')\n    testRuntimeOnly runtimeTestLibs\n"
          if text.count(anchor) != 1:
              raise SystemExit(f"build.gradle: expected core runtime anchor once, got {text.count(anchor)}")
          build.write_text(text.replace(anchor, replacement, 1))

          test = Path("core/src/test/java/kafka/server/SharedStorageKRaftIntegrationTest.java")
          source = test.read_text()
          for unused in ["import java.util.HashMap;\n", "import java.util.Set;\n"]:
              if source.count(unused) != 1:
                  raise SystemExit(f"integration test: expected import once: {unused.strip()}")
              source = source.replace(unused, "", 1)
          test.write_text(source)
          PY

          rm .github/workflows/shared-e2e-deps-once.yml
          git diff --check
          test "$(grep -c "testRuntimeOnly project(':storage:shared-storage-s3')" build.gradle)" -eq 1

      - name: Commit exact patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Jianbin Chen"
          git config user.email "jianbin@apache.org"
          git add build.gradle \
                  core/src/test/java/kafka/server/SharedStorageKRaftIntegrationTest.java \
                  .github/workflows/shared-e2e-deps-once.yml
          git commit -m "KAFKA-Shared: wire S3 runtime into failover integration test"
          git push origin HEAD:shared-wal-s3-4.3.1
