name: Shared Storage Orphan Compaction Recovery

on:
  push:
    branches:
      - codex/orphan-compaction-ci
      - codex/orphan-claim-safety
    paths:
      - 'storage/src/main/java/org/apache/kafka/storage/internals/shared/metadata/SharedMetadataImage.java'
      - 'storage/src/test/java/org/apache/kafka/storage/internals/shared/metadata/SharedMetadataImageTest.java'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/shared/object/ObjectStore.java'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/shared/object/OrphanObjectCleaner.java'
      - 'storage/src/test/java/org/apache/kafka/storage/internals/shared/object/OrphanObjectCleanerTest.java'
      - 'storage/shared-storage-s3/src/main/java/org/apache/kafka/storage/internals/shared/s3/KafkaObjectMetadataStore.java'
      - 'storage/shared-storage-s3/src/main/java/org/apache/kafka/storage/internals/shared/s3/FencedObjectLifecycleArbiter.java'
      - 'storage/shared-storage-s3/src/main/java/org/apache/kafka/storage/internals/shared/s3/S3ObjectStore.java'
      - 'storage/shared-storage-s3/src/main/java/org/apache/kafka/storage/internals/shared/s3/S3ObjectStoreConfig.java'
      - 'storage/shared-storage-s3/src/main/java/org/apache/kafka/storage/internals/shared/s3/S3SharedStorageExtension.java'
      - 'storage/shared-storage-s3/src/test/java/org/apache/kafka/storage/internals/shared/s3/KafkaObjectMetadataStoreTest.java'
      - 'storage/shared-storage-s3/src/test/java/org/apache/kafka/storage/internals/shared/s3/KafkaOrphanCompactionMinioIntegrationTest.java'
      - '.github/workflows/shared-storage-orphan-compaction.yml'
  pull_request:
    paths:
      - 'storage/shared-storage-s3/src/main/java/org/apache/kafka/storage/internals/shared/s3/KafkaObjectMetadataStore.java'
      - 'storage/shared-storage-s3/src/main/java/org/apache/kafka/storage/internals/shared/s3/FencedObjectLifecycleArbiter.java'
      - 'storage/shared-storage-s3/src/main/java/org/apache/kafka/storage/internals/shared/s3/S3ObjectStore.java'
      - 'storage/shared-storage-s3/src/main/java/org/apache/kafka/storage/internals/shared/s3/S3ObjectStoreConfig.java'
      - 'storage/shared-storage-s3/src/main/java/org/apache/kafka/storage/internals/shared/s3/S3SharedStorageExtension.java'
      - 'storage/shared-storage-s3/src/test/java/org/apache/kafka/storage/internals/shared/s3/KafkaObjectMetadataStoreTest.java'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/shared/metadata/SharedMetadataImage.java'
      - 'storage/src/test/java/org/apache/kafka/storage/internals/shared/metadata/SharedMetadataImageTest.java'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/shared/object/ObjectStore.java'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/shared/object/OrphanObjectCleaner.java'
      - 'storage/src/test/java/org/apache/kafka/storage/internals/shared/object/OrphanObjectCleanerTest.java'
      - 'storage/shared-storage-s3/src/test/java/org/apache/kafka/storage/internals/shared/s3/KafkaOrphanCompactionMinioIntegrationTest.java'
      - '.github/workflows/shared-storage-orphan-compaction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compaction-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Start MinIO
        uses: ./.github/actions/setup-minio
        with:
          bucket: kafka-orphan-compaction-test

      - name: Start three isolated Kafka brokers
        shell: bash
        run: |
          set -euo pipefail
          voters='1@127.0.0.1:19101,2@127.0.0.1:19102,3@127.0.0.1:19103'
          for id in 1 2 3; do
            port=$((19090 + id))
            controller_port=$((19100 + id))
            docker run -d --network host --name "orphan-kafka-${id}" \
              -e CLUSTER_ID=4L6g3nShT-eMCtK--X86sw \
              -e KAFKA_NODE_ID="$id" \
              -e KAFKA_PROCESS_ROLES=broker,controller \
              -e KAFKA_CONTROLLER_QUORUM_VOTERS="$voters" \
              -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
              -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
              -e KAFKA_LISTENERS="PLAINTEXT://127.0.0.1:${port},CONTROLLER://127.0.0.1:${controller_port}" \
              -e KAFKA_ADVERTISED_LISTENERS="PLAINTEXT://127.0.0.1:${port}" \
              -e KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT \
              -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=3 \
              -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3 \
              -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=2 \
              -e KAFKA_LOG_CLEANER_BACKOFF_MS=1000 \
              -e KAFKA_HEAP_OPTS='-Xms128m -Xmx512m' \
              apache/kafka:4.3.1
          done
          for attempt in $(seq 1 90); do
            if docker exec orphan-kafka-1 /opt/kafka/bin/kafka-broker-api-versions.sh \
                --bootstrap-server 127.0.0.1:19091 >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo 'Kafka did not become ready' >&2
          exit 1

      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          java-version: 25
          gradle-cache-read-only: true

      - name: Run metadata and real Kafka/MinIO recovery tests
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin123
          AWS_REGION: us-east-1
          SHARED_STORAGE_S3_ENDPOINT: http://127.0.0.1:9000
          SHARED_STORAGE_KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:19091,127.0.0.1:19092,127.0.0.1:19093
          SHARED_STORAGE_ISOLATED_TEST_CLUSTER: 'true'
        run: |
          set -euo pipefail
          ./gradlew :storage:test \
            --tests 'org.apache.kafka.storage.internals.shared.metadata.SharedMetadataImageTest' \
            :storage:shared-storage-s3:test \
            --tests 'org.apache.kafka.storage.internals.shared.s3.KafkaOrphanCompactionMinioIntegrationTest' \
            --tests 'org.apache.kafka.storage.internals.shared.s3.KafkaObjectMetadataStoreTest' \
            -x :storage:checkstyleMain -x :storage:checkstyleTest \
            -x :storage:spotbugsMain -x :storage:spotbugsTest \
            -PmaxParallelForks=1 -Dorg.gradle.jvmargs=-Xmx2g --no-scan
          result="$(find storage/shared-storage-s3/build/test-results build/junit-xml \
            -name 'TEST-org.apache.kafka.storage.internals.shared.s3.KafkaOrphanCompactionMinioIntegrationTest.xml' \
            -print -quit 2>/dev/null || true)"
          test -n "$result"
          grep -q 'failures="0"' "$result"
          grep -q 'errors="0"' "$result"
          grep -q 'skipped="0"' "$result"

      - name: Capture Kafka logs on failure
        if: failure()
        shell: bash
        run: |
          for id in 1 2 3; do docker logs "orphan-kafka-${id}" 2>&1 | tail -150 || true; done

      - name: Stop isolated Kafka brokers
        if: always()
        shell: bash
        run: |
          for id in 1 2 3; do docker rm -f "orphan-kafka-${id}" || true; done
