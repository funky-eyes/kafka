name: Shared Storage KRaft COMMITTED Terminal

on:
  push:
    branches:
      - codex/kraft-committed-terminal-writer
      - codex/kraft-terminal-batch
    paths:
      - 'metadata/src/main/java/org/apache/kafka/controller/CommittedObjectRetirementControlManager.java'
      - 'metadata/src/main/java/org/apache/kafka/controller/QuorumController.java'
      - 'metadata/src/test/java/org/apache/kafka/controller/CommittedObjectRetirementControlManagerTest.java'
      - 'metadata/src/test/java/org/apache/kafka/controller/QuorumControllerTest.java'
      - 'metadata/src/main/resources/common/metadata/CommittedObjectRetirementRecord.json'
      - '.github/workflows/shared-storage-kraft-committed-terminal.yml'
  pull_request:
    paths:
      - 'metadata/src/main/java/org/apache/kafka/controller/CommittedObjectRetirementControlManager.java'
      - 'metadata/src/main/java/org/apache/kafka/controller/QuorumController.java'
      - 'metadata/src/test/java/org/apache/kafka/controller/CommittedObjectRetirementControlManagerTest.java'
      - 'metadata/src/test/java/org/apache/kafka/controller/QuorumControllerTest.java'
      - 'metadata/src/main/resources/common/metadata/CommittedObjectRetirementRecord.json'
      - '.github/workflows/shared-storage-kraft-committed-terminal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terminal-record:
    name: Java 25 KRaft terminal record CAS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Configure Java 25 and Gradle
        uses: ./.github/actions/setup-gradle
        with:
          java-version: 25
          gradle-cache-read-only: true

      - name: Compile and enforce metadata Checkstyle
        run: |
          ./gradlew :metadata:checkstyleMain :metadata:checkstyleTest \
            :metadata:spotbugsMain --no-scan --max-workers=2

      - name: Controller terminal CAS and inactive-feature regression
        run: |
          ./gradlew :metadata:test \
            --tests 'org.apache.kafka.controller.CommittedObjectRetirementControlManagerTest' \
            --tests 'org.apache.kafka.controller.QuorumControllerTest.testCommittedObjectIntentCannotBypassUnnegotiatedFeature' \
            --tests 'org.apache.kafka.controller.QuorumControllerTest.testCommittedObjectIntentBatchCannotBypassUnnegotiatedFeature' \
            --tests 'org.apache.kafka.controller.QuorumControllerTest.testNegotiatedControllerAppendsOnlyFirstNonAuthorizingIntent' \
            --tests 'org.apache.kafka.controller.QuorumControllerTest.testNegotiatedControllerAppendsAtomicIntentBatchAtActualOffsets' \
            --tests 'org.apache.kafka.controller.QuorumControllerTest.testTerminalObjectRetirementWriterCannotBypassUnnegotiatedFeature' \
            --tests 'org.apache.kafka.controller.QuorumControllerTest.testTerminalBatchCannotBypassUnnegotiatedFeature' \
            --tests 'org.apache.kafka.controller.QuorumControllerTest.testNegotiatedControllerAtomicallyAppendsOnlyRecordedTerminalBatch' \
            --no-scan --max-workers=2 -PmaxParallelForks=1
