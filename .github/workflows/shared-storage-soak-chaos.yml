name: Shared Storage Soak and Chaos

on:
  push:
    branches:
      - shared-wal-s3-4.3.1
    paths:
      - 'gradle.properties'
      - 'gradle/dependencies.gradle'
      - 'gradlew'
      - 'wrapper.gradle'
      - 'gradle/wrapper/gradle-wrapper.properties'
      # Every production-fingerprint change invalidates this gate's GA evidence.
      - 'build.gradle'
      - 'settings.gradle'
      - 'storage/shared-storage-s3/build.gradle'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/shared/**'
      - 'storage/shared-storage-s3/src/main/**'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/log/**'
      - 'core/src/main/scala/kafka/cluster/Partition.scala'
      - 'core/src/main/scala/kafka/log/LogManager.scala'
      - 'core/src/main/scala/kafka/server/**'
      - 'core/src/main/java/kafka/server/builders/LogManagerBuilder.java'
      - 'core/src/test/java/kafka/server/SharedStorageHighAvailabilityE2ETest.java'
      - 'core/src/test/java/kafka/server/SharedStorageKafkaClientFailoverE2ETest.java'
      - 'core/src/test/java/kafka/server/SharedStorageS3OutageKRaftIntegrationTest.java'
      - 'core/src/test/java/kafka/server/SharedStorageLocalStateLossE2ETest.java'
      - '.github/actions/setup-gradle/**'
      - '.github/actions/setup-minio/**'
      - 'tools/shared_storage_minio_fixture.sh'
      - '.github/workflows/shared-storage-soak-chaos.yml'
  workflow_dispatch:
    inputs:
      iterations:
        description: Number of complete HA/failure cycles
        required: true
        default: "3"
        type: string

permissions:
  contents: read

jobs:
  repeated-failure-cycles:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup pinned MinIO fixture
        uses: ./.github/actions/setup-minio
        with:
          bucket: kafka-shared-storage-soak
      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          java-version: 25
          gradle-cache-read-only: true

      - name: Run repeated HA and failure cycles
        run: |
          "${GITHUB_WORKSPACE}/tools/shared_storage_minio_fixture.sh" start
          "${GITHUB_WORKSPACE}/tools/shared_storage_minio_fixture.sh" wait-ready 30 || true
      - name: Record object-store convergence evidence
        if: always()
        run: |
          "${GITHUB_WORKSPACE}/tools/shared_storage_minio_fixture.sh" start
          "${GITHUB_WORKSPACE}/tools/shared_storage_minio_fixture.sh" wait-ready 30 || true
          {
            "${GITHUB_WORKSPACE}/tools/shared_storage_minio_fixture.sh" du "kafka-shared-storage-soak"
            "${GITHUB_WORKSPACE}/tools/shared_storage_minio_fixture.sh" find "kafka-shared-storage-soak"
          } | tee shared-storage-soak-objects.log || true
      - name: Restore MinIO for diagnostics
        if: always()
        run: |
          "${GITHUB_WORKSPACE}/tools/shared_storage_minio_fixture.sh" start
          "${GITHUB_WORKSPACE}/tools/shared_storage_minio_fixture.sh" wait-ready 30 || true
      - name: Upload soak evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-storage-soak-evidence
          path: |
            shared-storage-soak.log
            shared-storage-soak-objects.log
            core/build/test-results/test/**
          if-no-files-found: warn

      - name: MinIO logs
        if: failure()
        run: |
          "${GITHUB_WORKSPACE}/tools/shared_storage_minio_fixture.sh" logs || true