name: Shared Storage Soak and Chaos

on:
  push:
    branches:
      - shared-wal-s3-4.3.1
    paths:
      - 'clients/src/main/java/org/apache/kafka/common/config/TopicConfig.java'
      - 'metadata/src/main/java/org/apache/kafka/controller/ConfigurationControlManager.java'
      - 'metadata/src/main/java/org/apache/kafka/controller/FeatureControlManager.java'
      - 'metadata/src/main/java/org/apache/kafka/controller/ReplicationControlManager.java'
      - 'server-common/src/main/java/org/apache/kafka/server/common/Feature.java'
      - 'server-common/src/main/java/org/apache/kafka/server/common/SharedStorageVersion.java'
      - 'server/src/main/java/org/apache/kafka/server/BrokerFeatures.java'
      - 'server/src/main/java/org/apache/kafka/server/BrokerLifecycleManager.java'
      - 'metadata/src/main/java/org/apache/kafka/controller/QuorumController.java'
      - 'metadata/src/main/java/org/apache/kafka/controller/ControllerRequestContext.java'
      - 'core/src/main/scala/kafka/server/ControllerApis.scala'
      - 'metadata/src/main/java/org/apache/kafka/controller/PartitionRetirement*.java'
      - 'metadata/src/main/java/org/apache/kafka/metadata/BrokerHeartbeatReply.java'
      - 'metadata/src/main/java/org/apache/kafka/metadata/PartitionRetirementAuthorityState.java'
      - 'metadata/src/main/java/org/apache/kafka/image/PartitionRetirementAuthority*.java'
      - 'server/src/main/java/org/apache/kafka/server/BrokerHeartbeatSourceWalReportDispatch.java'
      - 'server-common/src/main/java/org/apache/kafka/server/common/NodeToControllerChannelManager.java'
      - 'clients/src/main/java/org/apache/kafka/common/replica/PartitionRetirementSourceProbe.java'
      - 'clients/src/main/java/org/apache/kafka/common/requests/BrokerHeartbeatRequest.java'
      - 'clients/src/main/resources/common/message/BrokerHeartbeatRequest.json'
      - 'clients/src/main/resources/common/message/BrokerHeartbeatResponse.json'
      - 'gradle.properties'
      - 'gradle/dependencies.gradle'
      - 'gradlew'
      - 'wrapper.gradle'
      - 'gradle/wrapper/gradle-wrapper.properties'
      # Every production-fingerprint change invalidates this gate's GA evidence.
      - 'build.gradle'
      - 'settings.gradle'
      - 'storage/shared-storage-s3/build.gradle'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/shared/**'
      - 'storage/shared-storage-s3/src/main/**'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/log/**'
      - 'core/src/main/scala/kafka/cluster/Partition.scala'
      - 'core/src/main/scala/kafka/log/LogManager.scala'
      - 'core/src/main/scala/kafka/server/**'
      - 'core/src/main/java/kafka/server/builders/LogManagerBuilder.java'
      - 'core/src/test/java/kafka/server/SharedStorageHighAvailabilityE2ETest.java'
      - 'core/src/test/java/kafka/server/SharedStorageKafkaClientFailoverE2ETest.java'
      - 'core/src/test/java/kafka/server/SharedStorageS3OutageKRaftIntegrationTest.java'
      - 'core/src/test/java/kafka/server/SharedStorageLocalStateLossE2ETest.java'
      - '.github/actions/setup-gradle/**'
      - '.github/actions/setup-minio/**'
      - 'tools/shared_storage_minio_fixture.sh'
      - '.github/workflows/shared-storage-soak-chaos.yml'
  workflow_dispatch:
    inputs:
      iterations:
        description: Number of complete HA/failure cycles
        required: true
        default: "3"
        type: string

permissions:
  contents: read

jobs:
  repeated-failure-cycles:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup pinned MinIO fixture
        uses: ./.github/actions/setup-minio
        with:
          bucket: kafka-shared-storage-soak
      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          java-version: 25
          gradle-cache-read-only: true

      - name: Run repeated HA and failure cycles
        env:
          SOAK_ITERATIONS: ${{ inputs.iterations || '3' }}
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin123
          AWS_REGION: us-east-1
          SHARED_STORAGE_S3_ENDPOINT: http://127.0.0.1:9000
          SHARED_STORAGE_S3_REGION: us-east-1
          SHARED_STORAGE_S3_BUCKET: kafka-shared-storage-soak
          SHARED_STORAGE_S3_CONTROL: ${{ github.workspace }}/tools/shared_storage_minio_fixture.sh
        run: |
          set -euo pipefail
          mkdir -p shared-storage-soak-results
          if [[ ! "$SOAK_ITERATIONS" =~ ^[1-9][0-9]?$ ]]; then
            echo "Expected a positive iteration count below 100" >&2
            exit 1
          fi
          for ((cycle = 1; cycle <= SOAK_ITERATIONS; cycle++)); do
            cycle_dir="shared-storage-soak-results/cycle-$cycle"
            mkdir "$cycle_dir"
            ./gradlew :core:test --rerun \
              --tests 'kafka.server.SharedStorageHighAvailabilityE2ETest' \
              --tests 'kafka.server.SharedStorageKafkaClientFailoverE2ETest' \
              --tests 'kafka.server.SharedStorageS3OutageKRaftIntegrationTest' \
              --tests 'kafka.server.SharedStorageLocalStateLossE2ETest.topicOptInRecoversAfterAllSharedWalAndCheckpointStateIsLost' \
              -x :core:checkstyleMain -x :core:checkstyleTest \
              -x :core:spotbugsMain -x :core:spotbugsTest \
              -PmaxParallelForks=1 --no-scan 2>&1 | tee "$cycle_dir/test.log"
            python3 - "$cycle_dir" <<'PYTEST'
          from pathlib import Path
          import shutil
          import sys
          from xml.etree import ElementTree as ET

          output = Path(sys.argv[1])
          results = Path("core/build/test-results/test")
          required = {
              "SharedStorageHighAvailabilityE2ETest": 1,
              "SharedStorageKafkaClientFailoverE2ETest": 3,
              "SharedStorageS3OutageKRaftIntegrationTest": 1,
              "SharedStorageLocalStateLossE2ETest": 1,
          }
          for suite, count in required.items():
              path = results / f"TEST-kafka.server.{suite}.xml"
              root = ET.parse(path).getroot()
              assert int(root.get("tests")) == count, (path, root.attrib)
              assert all(root.get(field) == "0" for field in ("skipped", "failures", "errors")), (path, root.attrib)
              shutil.copyfile(path, output / path.name)
          PYTEST
          done
      - name: Record object-store convergence evidence
        if: always()
        run: |
          "${GITHUB_WORKSPACE}/tools/shared_storage_minio_fixture.sh" start
          "${GITHUB_WORKSPACE}/tools/shared_storage_minio_fixture.sh" wait-ready 30 || true
          {
            "${GITHUB_WORKSPACE}/tools/shared_storage_minio_fixture.sh" du "kafka-shared-storage-soak"
            "${GITHUB_WORKSPACE}/tools/shared_storage_minio_fixture.sh" find "kafka-shared-storage-soak"
          } | tee shared-storage-soak-objects.log || true
      - name: Restore MinIO for diagnostics
        if: always()
        run: |
          "${GITHUB_WORKSPACE}/tools/shared_storage_minio_fixture.sh" start
          "${GITHUB_WORKSPACE}/tools/shared_storage_minio_fixture.sh" wait-ready 30 || true
      - name: Upload soak evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-storage-soak-evidence
          path: |
            shared-storage-soak-results/
            shared-storage-soak-objects.log
            core/build/test-results/test/**
          if-no-files-found: warn

      - name: MinIO logs
        if: failure()
        run: |
          "${GITHUB_WORKSPACE}/tools/shared_storage_minio_fixture.sh" logs || true