name: Shared Storage Real S3 Compatibility

on:
  push:
    branches:
      - shared-wal-s3-4.3.1-real-s3
  workflow_dispatch:
    inputs:
      bucket:
        description: Existing AWS S3 bucket dedicated to Shared Storage compatibility testing
        required: true
        type: string
      region:
        description: AWS region containing the bucket
        required: true
        default: us-east-1
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: shared-storage-real-s3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  aws-s3-compatibility:
    name: AWS S3 single-put, range-read, multipart, and delete
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: shared-storage-aws-s3
    env:
      SHARED_STORAGE_REAL_S3_BUCKET: ${{ github.event_name == 'workflow_dispatch' && inputs.bucket || vars.SHARED_STORAGE_AWS_S3_BUCKET }}
      SHARED_STORAGE_REAL_S3_REGION: ${{ github.event_name == 'workflow_dispatch' && inputs.region || vars.SHARED_STORAGE_AWS_S3_REGION || 'us-east-1' }}
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate real S3 evidence configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SHARED_STORAGE_REAL_S3_BUCKET}" ]; then
            echo "SHARED_STORAGE_AWS_S3_BUCKET environment variable is required for branch-triggered real-S3 evidence."
            exit 1
          fi

      - name: Configure AWS workload credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.SHARED_STORAGE_AWS_ROLE_ARN }}
          aws-region: ${{ env.SHARED_STORAGE_REAL_S3_REGION }}
          role-session-name: kafka-shared-storage-ga

      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          java-version: 25
          gradle-cache-read-only: true

      - name: Run real AWS S3 compatibility proof
        run: |
          set -o pipefail
          ./gradlew :storage:shared-storage-s3:test \
            --tests 'org.apache.kafka.storage.internals.shared.s3.S3RealCompatibilityTest' \
            -x :storage:shared-storage-s3:checkstyleMain \
            -x :storage:shared-storage-s3:checkstyleTest \
            -x :storage:shared-storage-s3:spotbugsMain \
            -x :storage:shared-storage-s3:spotbugsTest \
            --no-scan 2>&1 | tee shared-storage-real-s3.log

      - name: Upload real-S3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-storage-real-s3-evidence
          path: |
            shared-storage-real-s3.log
            storage/shared-storage-s3/build/test-results/test/**
          if-no-files-found: warn
