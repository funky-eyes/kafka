name: Apply Shared Removal Seam Once

on:
  push:
    branches:
      - shared-wal-s3-4.3.1
    paths:
      - '.github/workflows/shared-removal-seam-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 200
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for normalized branch head
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            git fetch origin shared-wal-s3-4.3.1 --force
            head=$(git rev-parse origin/shared-wal-s3-4.3.1)
            email=$(git show -s --format='%ae' "$head")
            if [ "$email" = "jianbin@apache.org" ]; then
              git reset --hard "$head"
              exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for author normalization" >&2
          exit 1

      - name: Apply exact removal notification seam
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old_lines, new_lines):
              p = Path(path)
              text = p.read_text()
              old = "\n".join(old_lines) + "\n"
              new = "\n".join(new_lines) + "\n"
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "core/src/main/scala/kafka/log/LogManager.scala",
              [
                  "  /** Reports completed local role transitions to the optional physical-storage observer. */",
                  "  def onLeadershipChange(leaders: util.Collection[TopicIdPartition], followers: util.Collection[TopicIdPartition]): Unit = {",
                  "    storagePartitionRoleListener.onLeadershipChange(leaders, followers)",
                  "  }",
                  ""
              ],
              [
                  "  /** Reports completed local role transitions to the optional physical-storage observer. */",
                  "  def onLeadershipChange(leaders: util.Collection[TopicIdPartition], followers: util.Collection[TopicIdPartition]): Unit = {",
                  "    storagePartitionRoleListener.onLeadershipChange(leaders, followers)",
                  "  }",
                  "",
                  "  /** Reports local replica removals before the local log is stopped or deleted. */",
                  "  def onPartitionsRemoved(partitions: util.Collection[TopicIdPartition]): Unit = {",
                  "    storagePartitionRoleListener.onPartitionsRemoved(partitions)",
                  "  }",
                  ""
              ]
          )

          replace_once(
              "core/src/main/scala/kafka/server/ReplicaManager.scala",
              [
                  "        val deletes = localChanges.deletes.asScala",
                  "          .map { tp =>",
                  "            val isCurrentLeader = Option(delta.image().getTopic(tp.topic()))",
                  "              .map(image => image.partitions().get(tp.partition()))",
                  "              .exists(partition => partition.leader == config.nodeId)",
                  "            val deleteRemoteLog = delta.topicWasDeleted(tp.topic()) && isCurrentLeader",
                  "            new StopPartition(tp, true, deleteRemoteLog, false)",
                  "          }",
                  "          .toSet",
                  "        stateChangeLogger.info(s\"Deleting ${deletes.size} partition(s).\")"
              ],
              [
                  "        val storageRemovals = localChanges.deletes.asScala.flatMap { tp =>",
                  "          Option(delta.image().getTopic(tp.topic()))",
                  "            .map(topic => new TopicIdPartition(topic.id(), tp))",
                  "        }.asJava",
                  "        logManager.onPartitionsRemoved(storageRemovals)",
                  "",
                  "        val deletes = localChanges.deletes.asScala",
                  "          .map { tp =>",
                  "            val isCurrentLeader = Option(delta.image().getTopic(tp.topic()))",
                  "              .map(image => image.partitions().get(tp.partition()))",
                  "              .exists(partition => partition.leader == config.nodeId)",
                  "            val deleteRemoteLog = delta.topicWasDeleted(tp.topic()) && isCurrentLeader",
                  "            new StopPartition(tp, true, deleteRemoteLog, false)",
                  "          }",
                  "          .toSet",
                  "        stateChangeLogger.info(s\"Deleting ${deletes.size} partition(s).\")"
              ]
          )
          PY

          rm .github/workflows/shared-removal-seam-once.yml
          git diff --check
          test "$(grep -c 'def onPartitionsRemoved' core/src/main/scala/kafka/log/LogManager.scala)" -eq 1
          test "$(grep -c 'logManager.onPartitionsRemoved' core/src/main/scala/kafka/server/ReplicaManager.scala)" -eq 1

      - name: Commit exact patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Jianbin Chen"
          git config user.email "jianbin@apache.org"
          git add core/src/main/scala/kafka/log/LogManager.scala \
                  core/src/main/scala/kafka/server/ReplicaManager.scala \
                  .github/workflows/shared-removal-seam-once.yml
          git commit -m "KAFKA-Shared: notify storage extensions of replica removal"
          git push origin HEAD:shared-wal-s3-4.3.1
