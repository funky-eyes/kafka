name: Shared Storage Real S3 GA Seal

on:
  push:
    branches:
      - shared-wal-s3-4.3.1-real-s3

permissions:
  actions: read
  contents: read

concurrency:
  group: shared-storage-real-s3-ga-seal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strict-ga-manifest:
    name: Seal GA with real AWS S3 evidence
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact evidence candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve candidate and evidence branch
        id: candidate
        shell: bash
        env:
          REAL_S3_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "${REAL_S3_BRANCH}" in
            *-real-s3) ;;
            *)
              echo "Unexpected Real S3 evidence branch: ${REAL_S3_BRANCH}"
              exit 1
              ;;
          esac
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          echo "evidence_branch=${REAL_S3_BRANCH%-real-s3}" >> "${GITHUB_OUTPUT}"

      - name: Test GA manifest evidence rules
        run: python3 tools/test_shared_storage_ga_manifest.py

      - name: Validate GA workflow consistency
        run: python3 tools/check_shared_storage_ga_workflows.py

      - name: Wait for strict real-S3 GA evidence
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.candidate.outputs.sha }}
          EVIDENCE_BRANCH: ${{ steps.candidate.outputs.evidence_branch }}
          REAL_S3_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1200))
          source_attempt=0

          verify_canonical_head() {
            canonical_sha=$(
              git ls-remote --exit-code origin "refs/heads/${EVIDENCE_BRANCH}" |
                awk 'NR == 1 {print $1}'
            )
            if [ -z "${canonical_sha}" ]; then
              echo "::error::Cannot resolve canonical evidence branch ${EVIDENCE_BRANCH}."
              exit 1
            fi
            if [ "${canonical_sha}" != "${RELEASE_SHA}" ]; then
              echo "::error::Canonical evidence branch ${EVIDENCE_BRANCH} moved to ${canonical_sha}; expected ${RELEASE_SHA}."
              exit 1
            fi
          }

          while true; do
            source_attempt=$((source_attempt + 1))
            verify_canonical_head
            set +e
            python3 tools/shared_storage_ga_source_runs.py \
              --repo "${{ github.repository }}" \
              --branch "${REAL_S3_BRANCH}" \
              --sha "${RELEASE_SHA}" \
              --workflow "Shared Storage Real S3 Compatibility" \
              --require-present \
              > /tmp/shared-storage-real-s3-source-runs.out 2>&1
            source_status=$?
            set -e
            cat /tmp/shared-storage-real-s3-source-runs.out

            if [ "${source_status}" -eq 0 ]; then
              break
            fi
            if [ "${source_status}" -eq 2 ]; then
              echo "Exact-SHA Real S3 evidence has a terminal failure; evaluating the strict manifest now."
              break
            fi
            if [ "${source_status}" -ne 1 ]; then
              exit "${source_status}"
            fi
            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "Exact-SHA Real S3 evidence wait reached the deadline; evaluating the strict manifest now."
              break
            fi
            echo "Exact-SHA Real S3 evidence attempt ${source_attempt} is still active."
            sleep 15
          done

          verify_canonical_head
          rm -f shared-storage-ga-real-s3-manifest.md /tmp/shared-storage-ga-real-s3.out
          set +e
          python3 tools/shared_storage_ga_manifest.py \
            --repo "${{ github.repository }}" \
            --ref "${RELEASE_SHA}" \
            --evidence-branch "${EVIDENCE_BRANCH}" \
            --require-real-s3 \
            --require-real-s3-exact-sha \
            --require-real-s3-branch-push \
            --output shared-storage-ga-real-s3-manifest.md \
            > /tmp/shared-storage-ga-real-s3.out 2>&1
          status=$?
          set -e
          verify_canonical_head
          cat /tmp/shared-storage-ga-real-s3.out
          exit "${status}"

      - name: Upload strict real-S3 GA manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-storage-real-s3-ga-manifest
          path: shared-storage-ga-real-s3-manifest.md
          if-no-files-found: error
