name: Shared Storage GA Release Gate

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Commit or branch to evaluate
        required: true
        default: shared-wal-s3-4.3.1
        type: string
      require_real_s3:
        description: Require real AWS S3 compatibility evidence
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

jobs:
  ga-evidence-manifest:
    name: Build GA evidence manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release ref
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_ref }}
          persist-credentials: false

      - name: Validate GA workflow consistency
        run: python3 tools/check_shared_storage_ga_workflows.py

      - name: Evaluate release criteria
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          args=(
            --repo "${{ github.repository }}"
            --ref "${{ inputs.release_ref }}"
            --output shared-storage-ga-manifest.md
          )
          if [[ "${{ inputs.require_real_s3 }}" == "true" ]]; then
            args+=(--require-real-s3)
          fi
          python3 tools/shared_storage_ga_manifest.py "${args[@]}"

      - name: Upload GA manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-storage-ga-manifest
          path: shared-storage-ga-manifest.md
          if-no-files-found: error
