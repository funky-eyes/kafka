name: Shared Storage GA Release Gate

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Commit or branch to evaluate
        required: true
        default: shared-wal-s3-4.3.1
        type: string
      evidence_branch:
        description: Branch whose GitHub Actions runs are allowed as GA evidence
        required: true
        default: shared-wal-s3-4.3.1
        type: string
      require_real_s3:
        description: Require exact-SHA AWS S3 evidence (disable only for MinIO-only preflight; not AWS S3 GA)
        required: true
        default: true
        type: boolean

permissions:
  actions: read
  contents: read

jobs:
  ga-evidence-manifest:
    name: ${{ inputs.require_real_s3 && 'Strict AWS S3 GA evidence' || 'MinIO-only preflight evidence' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release ref
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_ref }}
          persist-credentials: false

      - name: Resolve checked-out release SHA
        id: release-sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Test GA manifest evidence rules
        run: python3 tools/test_shared_storage_ga_manifest.py

      - name: Validate GA workflow consistency
        run: python3 tools/check_shared_storage_ga_workflows.py

      - name: Declare release evidence scope
        shell: bash
        env:
          REQUIRE_REAL_S3: ${{ inputs.require_real_s3 }}
        run: |
          set -euo pipefail
          if [ "${REQUIRE_REAL_S3}" = "true" ]; then
            echo "## Strict AWS S3 GA release evidence" >> "${GITHUB_STEP_SUMMARY}"
            echo "Requires same-SHA AWS S3 compatibility from the dedicated evidence branch." >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "::warning::MinIO-only evidence is not an AWS S3 GA release certification."
            echo "## MinIO-only preflight (NOT AWS S3 GA)" >> "${GITHUB_STEP_SUMMARY}"
            echo "This run does not certify production AWS S3 compatibility." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Evaluate release criteria
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          args=(
            --repo "${{ github.repository }}"
            --ref "${{ steps.release-sha.outputs.sha }}"
            --evidence-branch "${{ inputs.evidence_branch }}"
            --output shared-storage-ga-manifest.md
          )
          if [[ "${{ inputs.require_real_s3 }}" == "true" ]]; then
            args+=(--require-real-s3 --require-real-s3-exact-sha --require-real-s3-branch-push)
          fi
          python3 tools/shared_storage_ga_manifest.py "${args[@]}"

      - name: Upload GA manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-storage-ga-manifest
          path: shared-storage-ga-manifest.md
          if-no-files-found: error
