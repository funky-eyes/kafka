name: Apply Shared HW Observer Once

on:
  push:
    branches:
      - shared-wal-s3-4.3.1
    paths:
      - '.github/workflows/shared-hw-observer-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout normalized branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 200
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for author normalization
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            git fetch origin shared-wal-s3-4.3.1 --force
            head=$(git rev-parse origin/shared-wal-s3-4.3.1)
            email=$(git show -s --format='%ae' "$head")
            if [ "$email" = "jianbin@apache.org" ]; then
              git reset --hard "$head"
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Add persistent high-watermark observer seam
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          unified = Path('storage/src/main/java/org/apache/kafka/storage/internals/log/UnifiedLog.java')
          text = unified.read_text()

          field = '    private volatile LogOffsetsListener logOffsetsListener;'
          replacement = '\n'.join([
              field,
              '    private final List<LogOffsetsListener> additionalLogOffsetsListeners = new ArrayList<>();',
          ])
          if text.count(field) != 1:
              raise SystemExit(f'expected UnifiedLog listener field once, got {text.count(field)}')
          text = text.replace(field, replacement, 1)

          callback = 'logOffsetsListener.onHighWatermarkUpdated(highWatermarkMetadata.messageOffset);'
          if text.count(callback) != 2:
              raise SystemExit(f'expected two direct HW callbacks, got {text.count(callback)}')
          text = text.replace(callback, 'notifyHighWatermarkUpdated(highWatermarkMetadata.messageOffset);')

          setter = '\n'.join([
              '    public void setLogOffsetsListener(LogOffsetsListener listener) {',
              '        logOffsetsListener = listener;',
              '    }',
          ])
          listener_api = '\n'.join([
              setter,
              '',
              '    /**',
              '     * Add an observer that remains registered when the primary log offsets listener is replaced.',
              '     * The observer is immediately initialized with the current high watermark.',
              '     */',
              '    public void addLogOffsetsListener(LogOffsetsListener listener) {',
              '        if (listener == null) {',
              '            throw new NullPointerException("listener");',
              '        }',
              '        synchronized (lock) {',
              '            additionalLogOffsetsListeners.add(listener);',
              '            listener.onHighWatermarkUpdated(highWatermarkMetadata.messageOffset);',
              '        }',
              '    }',
              '',
              '    private void notifyHighWatermarkUpdated(long highWatermark) {',
              '        logOffsetsListener.onHighWatermarkUpdated(highWatermark);',
              '        for (LogOffsetsListener listener : additionalLogOffsetsListeners) {',
              '            listener.onHighWatermarkUpdated(highWatermark);',
              '        }',
              '    }',
          ])
          if text.count(setter) != 1:
              raise SystemExit(f'expected UnifiedLog listener setter once, got {text.count(setter)}')
          text = text.replace(setter, listener_api, 1)
          unified.write_text(text)

          factory = Path('storage/src/main/java/org/apache/kafka/storage/internals/shared/kafka/SharedUnifiedLogFactory.java')
          text = factory.read_text()
          old = '\n'.join([
              '        LogOffsetsListener delegate = context.logOffsetsListener();',
              '        LogOffsetsListener offsetsListener = new LogOffsetsListener() {',
              '            @Override',
              '            public void onHighWatermarkUpdated(long highWatermark) {',
              '                // Kafka may hold log locks here. Keep the shared side O(1), non-blocking and I/O-free.',
              '                commitProgress.onHighWatermarkUpdated(sharedPartition, highWatermark);',
              '                delegate.onHighWatermarkUpdated(highWatermark);',
              '            }',
              '        };',
              '        return new UnifiedLog(',
              '            offsets.logStartOffset(),',
              '            localLog,',
              '            context.brokerTopicStats(),',
              '            context.producerIdExpirationCheckIntervalMs(),',
              '            leaderEpochCache,',
              '            producerStateManager,',
              '            Optional.of(effectiveTopicId),',
              '            false,',
              '            offsetsListener',
              '        );',
          ])
          new = '\n'.join([
              '        UnifiedLog log = new UnifiedLog(',
              '            offsets.logStartOffset(),',
              '            localLog,',
              '            context.brokerTopicStats(),',
              '            context.producerIdExpirationCheckIntervalMs(),',
              '            leaderEpochCache,',
              '            producerStateManager,',
              '            Optional.of(effectiveTopicId),',
              '            false,',
              '            context.logOffsetsListener()',
              '        );',
              '        log.addLogOffsetsListener(new LogOffsetsListener() {',
              '            @Override',
              '            public void onHighWatermarkUpdated(long highWatermark) {',
              '                // Kafka may hold log locks here. Keep the shared side O(1), non-blocking and I/O-free.',
              '                commitProgress.onHighWatermarkUpdated(sharedPartition, highWatermark);',
              '            }',
              '        });',
              '        return log;',
          ])
          if text.count(old) != 1:
              raise SystemExit(f'expected SharedUnifiedLogFactory HW wrapper once, got {text.count(old)}')
          factory.write_text(text.replace(old, new, 1))

          test = Path('storage/src/test/java/org/apache/kafka/storage/internals/log/UnifiedLogTest.java')
          text = test.read_text()
          anchor = '\n'.join([
              '    @Test',
              '    public void shouldApplyEpochToMessageOnAppendIfLeader() throws IOException {',
          ])
          method = '\n'.join([
              '    @Test',
              '    public void shouldKeepAdditionalLogOffsetsListenerWhenPrimaryListenerIsReplaced() throws IOException {',
              '        try (UnifiedLog log = createLog(logDir, new LogConfig(new Properties()))) {',
              '            List<Long> firstPrimaryUpdates = new ArrayList<>();',
              '            List<Long> replacementPrimaryUpdates = new ArrayList<>();',
              '            List<Long> additionalUpdates = new ArrayList<>();',
              '',
              '            log.setLogOffsetsListener(new LogOffsetsListener() {',
              '                @Override',
              '                public void onHighWatermarkUpdated(long highWatermark) {',
              '                    firstPrimaryUpdates.add(highWatermark);',
              '                }',
              '            });',
              '            log.addLogOffsetsListener(new LogOffsetsListener() {',
              '                @Override',
              '                public void onHighWatermarkUpdated(long highWatermark) {',
              '                    additionalUpdates.add(highWatermark);',
              '                }',
              '            });',
              '            assertEquals(List.of(0L), additionalUpdates);',
              '',
              '            log.appendAsLeader(',
              '                MemoryRecords.withRecords(Compression.NONE, new SimpleRecord("one".getBytes())),',
              '                0',
              '            );',
              '            log.updateHighWatermark(log.logEndOffset());',
              '            assertEquals(List.of(1L), firstPrimaryUpdates);',
              '            assertEquals(List.of(0L, 1L), additionalUpdates);',
              '',
              '            log.setLogOffsetsListener(new LogOffsetsListener() {',
              '                @Override',
              '                public void onHighWatermarkUpdated(long highWatermark) {',
              '                    replacementPrimaryUpdates.add(highWatermark);',
              '                }',
              '            });',
              '            log.appendAsLeader(',
              '                MemoryRecords.withRecords(Compression.NONE, new SimpleRecord("two".getBytes())),',
              '                0',
              '            );',
              '            log.updateHighWatermark(log.logEndOffset());',
              '',
              '            assertEquals(List.of(1L), firstPrimaryUpdates);',
              '            assertEquals(List.of(2L), replacementPrimaryUpdates);',
              '            assertEquals(List.of(0L, 1L, 2L), additionalUpdates);',
              '        }',
              '    }',
              '',
          ])
          if text.count(anchor) != 1:
              raise SystemExit(f'expected UnifiedLogTest insertion anchor once, got {text.count(anchor)}')
          test.write_text(text.replace(anchor, method + anchor, 1))
          PY
          git diff --check
          grep -q 'additionalLogOffsetsListeners' storage/src/main/java/org/apache/kafka/storage/internals/log/UnifiedLog.java
          grep -q 'log.addLogOffsetsListener' storage/src/main/java/org/apache/kafka/storage/internals/shared/kafka/SharedUnifiedLogFactory.java
          grep -q 'shouldKeepAdditionalLogOffsetsListenerWhenPrimaryListenerIsReplaced' storage/src/test/java/org/apache/kafka/storage/internals/log/UnifiedLogTest.java

      - name: Verify targeted storage behavior
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :storage:compileJava \
            :storage:compileTestJava \
            :core:compileScala \
            :storage:test \
            --tests 'org.apache.kafka.storage.internals.log.UnifiedLogTest.shouldKeepAdditionalLogOffsetsListenerWhenPrimaryListenerIsReplaced' \
            --tests 'org.apache.kafka.storage.internals.shared.kafka.SharedUnifiedLogFactoryTest' \
            :storage:checkstyleMain \
            :storage:checkstyleTest \
            --no-scan

      - name: Commit verified seam
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/shared-hw-observer-once.yml
          git diff --check
          git config user.name "Jianbin Chen"
          git config user.email "jianbin@apache.org"
          git add \
            storage/src/main/java/org/apache/kafka/storage/internals/log/UnifiedLog.java \
            storage/src/main/java/org/apache/kafka/storage/internals/shared/kafka/SharedUnifiedLogFactory.java \
            storage/src/test/java/org/apache/kafka/storage/internals/log/UnifiedLogTest.java \
            .github/workflows/shared-hw-observer-once.yml
          git commit -m "KAFKA-Shared: preserve shared HW observer across listener replacement"
          git push origin HEAD:shared-wal-s3-4.3.1
