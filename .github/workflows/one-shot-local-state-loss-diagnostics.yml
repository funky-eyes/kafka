name: One-shot local-state-loss diagnostics

on:
  push:
    branches:
      - shared-wal-s3-4.3.1
    paths:
      - .github/workflows/one-shot-local-state-loss-diagnostics.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: shared-wal-s3-4.3.1
      - name: Add per-partition recovery diagnostics
        shell: bash
        run: |
          set -euo pipefail
          branch='shared-wal-s3-4.3.1'
          workflow='.github/workflows/one-shot-local-state-loss-diagnostics.yml'
          git fetch origin "$branch"
          current="$(git rev-parse "origin/$branch")"
          base="$(git rev-parse "$current^")"
          changed="$(git diff --name-only "$base" "$current")"
          if [ "$changed" != "$workflow" ]; then
            echo "Unexpected branch delta: $changed"
            exit 1
          fi
          git checkout --detach "$base"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('core/src/test/java/kafka/server/SharedStorageLocalStateLossE2ETest.java')
          s = p.read_text()
          old = '''        int[] nextExpected = new int[PARTITIONS];
        int received = 0;
        try (KafkaConsumer<String, String> consumer = new KafkaConsumer<>(properties)) {
            consumer.assign(assignments);
            consumer.seekToBeginning(assignments);
            long deadline = System.nanoTime() + TimeUnit.SECONDS.toNanos(120);'''
          new = '''        int[] nextExpected = new int[PARTITIONS];
        int received = 0;
        Map<TopicPartition, Long> beginningOffsets;
        Map<TopicPartition, Long> visibleEndOffsets;
        try (KafkaConsumer<String, String> consumer = new KafkaConsumer<>(properties)) {
            consumer.assign(assignments);
            consumer.seekToBeginning(assignments);
            beginningOffsets = consumer.beginningOffsets(assignments);
            visibleEndOffsets = consumer.endOffsets(assignments);
            long deadline = System.nanoTime() + TimeUnit.SECONDS.toNanos(120);'''
          if s.count(old) != 1:
              raise SystemExit(f'consume setup anchor count={s.count(old)}')
          s = s.replace(old, new, 1)
          old2 = '''        assertEquals(expectedTotal, received, "Timed out reading the complete recovered acknowledged history");'''
          new2 = '''        assertEquals(expectedTotal, received,
            "Timed out reading the complete recovered acknowledged history; perPartition=" +
                java.util.Arrays.toString(nextExpected) + ", expectedPerPartition=" +
                java.util.Arrays.toString(expectedEndOffsets) + ", beginningOffsets=" + beginningOffsets +
                ", visibleEndOffsets=" + visibleEndOffsets);'''
          if s.count(old2) != 1:
              raise SystemExit(f'assert anchor count={s.count(old2)}')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
          git diff --check
          ./gradlew :core:compileTestJava :core:compileTestScala --no-daemon
          git add core/src/test/java/kafka/server/SharedStorageLocalStateLossE2ETest.java
          git -c user.name='Jianbin Chen' -c user.email='jianbin@apache.org' commit -m 'KAFKA-XXXX: report per-partition local-state recovery visibility'
          git fetch origin "$branch"
          lease="$(git rev-parse "origin/$branch")"
          changed="$(git diff --name-only "$base" "$lease" | grep -v -x "$workflow" || true)"
          if [ -n "$changed" ]; then
            echo "Branch changed outside temporary workflow: $changed"
            exit 1
          fi
          git push origin "HEAD:refs/heads/$branch" --force-with-lease="refs/heads/$branch:$lease"
