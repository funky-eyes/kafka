name: Shared Storage Kafka Semantics and HA

on:
  push:
    branches:
      - shared-wal-s3-4.3.1
    paths:
      - 'gradle.properties'
      - 'gradle/dependencies.gradle'
      - 'gradlew'
      - 'wrapper.gradle'
      - 'gradle/wrapper/gradle-wrapper.properties'
      # Every production-fingerprint change invalidates this gate's GA evidence.
      - 'build.gradle'
      - 'settings.gradle'
      - 'storage/shared-storage-s3/build.gradle'
      - 'storage/shared-storage-s3/src/main/**'
      - 'core/src/main/scala/kafka/server/**'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/shared/**'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/log/**'
      - 'core/src/main/scala/kafka/cluster/Partition.scala'
      - 'core/src/main/scala/kafka/log/LogManager.scala'
      - 'core/src/main/scala/kafka/server/BrokerServer.scala'
      - 'core/src/main/scala/kafka/server/ReplicaManager.scala'
      - 'core/src/main/scala/kafka/server/ReplicaFetcherThread.scala'
      - 'core/src/main/java/kafka/server/builders/LogManagerBuilder.java'
      - 'core/src/test/java/kafka/server/SharedStorageKafkaSemanticsParityIntegrationTest.java'
      - 'core/src/test/java/kafka/server/SharedStorageHighAvailabilityE2ETest.java'
      - '.github/actions/setup-gradle/**'
      - '.github/actions/setup-minio/**'
      - 'tools/shared_storage_minio_fixture.sh'
      - '.github/workflows/shared-storage-kafka-semantics-ha.yml'
  pull_request:
    paths:
      - 'storage/src/main/java/org/apache/kafka/storage/internals/shared/**'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/log/**'
      - 'core/src/main/scala/kafka/cluster/Partition.scala'
      - 'core/src/main/scala/kafka/log/LogManager.scala'
      - 'core/src/main/scala/kafka/server/BrokerServer.scala'
      - 'core/src/main/scala/kafka/server/ReplicaManager.scala'
      - 'core/src/main/scala/kafka/server/ReplicaFetcherThread.scala'
      - 'core/src/main/java/kafka/server/builders/LogManagerBuilder.java'
      - 'core/src/test/java/kafka/server/SharedStorageKafkaSemanticsParityIntegrationTest.java'
      - 'core/src/test/java/kafka/server/SharedStorageHighAvailabilityE2ETest.java'
      - '.github/workflows/shared-storage-kafka-semantics-ha.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-storage-kafka-semantics-ha-${{ github.ref }}
  cancel-in-progress: false

jobs:
  kafka-semantics-parity:
    name: Classic Kafka vs shared storage client semantics
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup pinned MinIO fixture
        uses: ./.github/actions/setup-minio
        with:
          bucket: kafka-shared-storage-parity
      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          java-version: 25
          gradle-cache-read-only: true

      - name: Compare classic Kafka and shared storage semantics
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin123
          AWS_REGION: us-east-1
          SHARED_STORAGE_S3_ENDPOINT: http://127.0.0.1:9000
          SHARED_STORAGE_S3_REGION: us-east-1
          SHARED_STORAGE_S3_BUCKET: kafka-shared-storage-parity
        run: |
          set -o pipefail
          ./gradlew :core:test \
            --tests 'kafka.server.SharedStorageKafkaSemanticsParityIntegrationTest' \
            -x :core:checkstyleMain \
            -x :core:checkstyleTest \
            -x :core:spotbugsMain \
            -x :core:spotbugsTest \
            --no-scan 2>&1 | tee shared-storage-kafka-parity.log

      - name: Show parity S3 objects
        if: always()
        run: |
          "${GITHUB_WORKSPACE}/tools/shared_storage_minio_fixture.sh" ls "kafka-shared-storage-parity" | tee shared-storage-kafka-parity-objects.log || true
      - name: Upload parity diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-storage-kafka-parity
          path: |
            shared-storage-kafka-parity.log
            shared-storage-kafka-parity-objects.log
            core/build/reports/tests/test
            core/build/test-results/test
          if-no-files-found: ignore
          retention-days: 7

      - name: MinIO logs
        if: always()
        run: |
          "${GITHUB_WORKSPACE}/tools/shared_storage_minio_fixture.sh" logs || true
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup pinned MinIO fixture
        uses: ./.github/actions/setup-minio
        with:
          bucket: kafka-shared-storage-ha
      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          java-version: 25
          gradle-cache-read-only: true

      - name: Exercise rolling and full broker restart recovery
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin123
          AWS_REGION: us-east-1
          SHARED_STORAGE_S3_ENDPOINT: http://127.0.0.1:9000
          SHARED_STORAGE_S3_REGION: us-east-1
          SHARED_STORAGE_S3_BUCKET: kafka-shared-storage-ha
        run: |
          set -o pipefail
          ./gradlew :core:test \
            --tests 'kafka.server.SharedStorageHighAvailabilityE2ETest' \
            -x :core:checkstyleMain \
            -x :core:checkstyleTest \
            -x :core:spotbugsMain \
            -x :core:spotbugsTest \
            --no-scan 2>&1 | tee shared-storage-ha-lifecycle.log

      - name: Show HA S3 objects
        if: always()
        run: |
          "${GITHUB_WORKSPACE}/tools/shared_storage_minio_fixture.sh" ls "kafka-shared-storage-ha" | tee shared-storage-ha-objects.log || true
      - name: Upload HA diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-storage-ha-lifecycle
          path: |
            shared-storage-ha-lifecycle.log
            shared-storage-ha-objects.log
            core/build/reports/tests/test
            core/build/test-results/test
          if-no-files-found: ignore
          retention-days: 7

      - name: MinIO logs
        if: always()
        run: |
          "${GITHUB_WORKSPACE}/tools/shared_storage_minio_fixture.sh" logs || true