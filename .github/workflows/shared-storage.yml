name: Shared Storage

on:
  push:
    branches:
      - shared-wal-s3-4.3.1
    paths:
      - 'build.gradle'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/shared/**'
      - 'storage/src/test/java/org/apache/kafka/storage/internals/shared/**'
      - 'storage/shared-storage-s3/**'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/log/LogLoader.java'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/log/LocalLog.java'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/log/LogOffsetsListener.java'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/log/LogSegmentFactory.java'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/log/UnifiedLog.java'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/log/UnifiedLogCreationContext.java'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/log/UnifiedLogFactory.java'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/log/KafkaStorageExtension.java'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/log/StorageExtensionBrokerContext.java'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/log/StorageExtensionContext.java'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/log/StorageExtensionLoader.java'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/log/StoragePartitionRoleListener.java'
      - 'storage/src/test/java/org/apache/kafka/storage/internals/log/LogLoaderSegmentFactoryTest.java'
      - 'storage/src/test/java/org/apache/kafka/storage/internals/log/StorageExtensionLoaderTest.java'
      - 'storage/src/test/java/org/apache/kafka/storage/internals/log/UnifiedLogTest.java'
      - 'core/src/main/scala/kafka/cluster/Partition.scala'
      - 'core/src/main/scala/kafka/log/LogManager.scala'
      - 'core/src/main/java/kafka/server/builders/LogManagerBuilder.java'
      - 'core/src/main/scala/kafka/server/BrokerServer.scala'
      - 'core/src/main/scala/kafka/server/ReplicaManager.scala'
      - 'core/src/main/scala/kafka/server/ReplicaFetcherThread.scala'
      - 'core/src/test/**/kafka/log/**'
      - 'core/src/test/**/kafka/server/**'
      - 'checkstyle/import-control-shared-storage-s3.xml'
      - 'settings.gradle'
      - '.github/workflows/shared-storage.yml'
  pull_request:
    paths:
      - 'build.gradle'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/shared/**'
      - 'storage/src/test/java/org/apache/kafka/storage/internals/shared/**'
      - 'storage/shared-storage-s3/**'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/log/LogLoader.java'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/log/LocalLog.java'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/log/LogOffsetsListener.java'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/log/LogSegmentFactory.java'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/log/UnifiedLog.java'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/log/UnifiedLogCreationContext.java'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/log/UnifiedLogFactory.java'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/log/KafkaStorageExtension.java'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/log/StorageExtensionBrokerContext.java'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/log/StorageExtensionContext.java'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/log/StorageExtensionLoader.java'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/log/StoragePartitionRoleListener.java'
      - 'storage/src/test/java/org/apache/kafka/storage/internals/log/LogLoaderSegmentFactoryTest.java'
      - 'storage/src/test/java/org/apache/kafka/storage/internals/log/StorageExtensionLoaderTest.java'
      - 'storage/src/test/java/org/apache/kafka/storage/internals/log/UnifiedLogTest.java'
      - 'core/src/main/scala/kafka/cluster/Partition.scala'
      - 'core/src/main/scala/kafka/log/LogManager.scala'
      - 'core/src/main/java/kafka/server/builders/LogManagerBuilder.java'
      - 'core/src/main/scala/kafka/server/BrokerServer.scala'
      - 'core/src/main/scala/kafka/server/ReplicaManager.scala'
      - 'core/src/main/scala/kafka/server/ReplicaFetcherThread.scala'
      - 'core/src/test/**/kafka/log/**'
      - 'core/src/test/**/kafka/server/**'
      - 'checkstyle/import-control-shared-storage-s3.xml'
      - 'settings.gradle'
      - '.github/workflows/shared-storage.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-storage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  storage-tests:
    name: Storage tests (Java 25)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          java-version: 25
          gradle-cache-read-only: true

      - name: Compile shared storage sources
        shell: bash
        run: |
          set -o pipefail
          ./gradlew \
            :storage:compileJava \
            :storage:compileTestJava \
            :storage:shared-storage-s3:compileJava \
            :storage:shared-storage-s3:compileTestJava \
            :core:compileScala \
            :core:compileTestJava \
            --no-scan 2>&1 | tee shared-storage-compile.log

      - name: Run shared storage tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :storage:test --no-scan \
            --tests 'org.apache.kafka.storage.internals.shared.*' \
            --tests 'org.apache.kafka.storage.internals.shared.metadata.*' \
            --tests 'org.apache.kafka.storage.internals.shared.object.*' \
            --tests 'org.apache.kafka.storage.internals.shared.wal.*' \
            --tests 'org.apache.kafka.storage.internals.log.LogLoaderSegmentFactoryTest' \
            --tests 'org.apache.kafka.storage.internals.log.StorageExtensionLoaderTest' \
            2>&1 | tee shared-storage-test.log

      - name: Run S3 module tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :storage:shared-storage-s3:test --no-scan 2>&1 | tee shared-storage-s3-test.log

      - name: Upload compile and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-storage-ci-logs
          path: |
            shared-storage-compile.log
            shared-storage-test.log
            shared-storage-s3-test.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload static analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-storage-static-analysis
          path: |
            storage/build/reports/spotbugs
            storage/build/reports/checkstyle
            storage/shared-storage-s3/build/reports/spotbugs
            storage/shared-storage-s3/build/reports/checkstyle
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-storage-test-reports
          path: |
            storage/build/reports/tests/test
            storage/shared-storage-s3/build/reports/tests/test
            core/build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 7

  minio-environment:
    name: MinIO + 3-broker KRaft E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Start MinIO
        run: |
          docker run --detach \
            --name kafka-shared-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadmin123 \
            minio/minio:latest \
            server /data --address :9000

      - name: Wait for MinIO readiness
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs kafka-shared-minio
          exit 1

      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          java-version: 25
          gradle-cache-read-only: true

      - name: Compile and exercise S3 object store against MinIO
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin123
          AWS_REGION: us-east-1
          SHARED_STORAGE_S3_ENDPOINT: http://127.0.0.1:9000
          SHARED_STORAGE_S3_REGION: us-east-1
          SHARED_STORAGE_S3_BUCKET: kafka-shared-storage-e2e
        run: |
          set -o pipefail
          ./gradlew \
            :storage:shared-storage-s3:compileJava \
            :storage:shared-storage-s3:compileTestJava \
            :storage:shared-storage-s3:test \
            --tests 'org.apache.kafka.storage.internals.shared.s3.S3ObjectStoreTest' \
            -x :storage:shared-storage-s3:checkstyleMain \
            -x :storage:shared-storage-s3:checkstyleTest \
            -x :storage:shared-storage-s3:spotbugsMain \
            -x :storage:shared-storage-s3:spotbugsTest \
            --no-scan 2>&1 | tee shared-storage-minio-e2e.log

      - name: Ensure MinIO bucket exists
        shell: bash
        run: |
          docker run --rm --network host --entrypoint /bin/sh minio/mc:latest -c '
            mc alias set local http://127.0.0.1:9000 minioadmin minioadmin123 >/dev/null &&
            mc mb --ignore-existing local/kafka-shared-storage-e2e >/dev/null
          '

      - name: Run replicated WAL leader failover E2E
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin123
          AWS_REGION: us-east-1
          SHARED_STORAGE_S3_ENDPOINT: http://127.0.0.1:9000
          SHARED_STORAGE_S3_REGION: us-east-1
          SHARED_STORAGE_S3_BUCKET: kafka-shared-storage-e2e
        run: |
          set -o pipefail
          ./gradlew :core:test \
            --tests 'kafka.server.SharedStorageKRaftIntegrationTest' \
            --no-scan 2>&1 | tee shared-storage-kraft-e2e.log

      - name: Show committed S3 objects
        if: always()
        shell: bash
        run: |
          docker run --rm --network host --entrypoint /bin/sh minio/mc:latest -c '
            mc alias set local http://127.0.0.1:9000 minioadmin minioadmin123 >/dev/null &&
            mc ls --recursive local/kafka-shared-storage-e2e || true
          ' | tee shared-storage-minio-objects.log

      - name: Run S3 static analysis diagnostics
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./gradlew \
            :storage:shared-storage-s3:checkstyleMain \
            :storage:shared-storage-s3:checkstyleTest \
            :storage:shared-storage-s3:spotbugsMain \
            :storage:shared-storage-s3:spotbugsTest \
            --no-scan 2>&1 | tee shared-storage-s3-static-analysis.log

      - name: Upload MinIO E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-storage-minio-e2e-log
          path: |
            shared-storage-minio-e2e.log
            shared-storage-kraft-e2e.log
            shared-storage-minio-objects.log
            shared-storage-s3-static-analysis.log
            storage/shared-storage-s3/build/reports/spotbugs
            storage/shared-storage-s3/build/reports/checkstyle
            core/build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 7

      - name: MinIO logs
        if: always()
        run: docker logs kafka-shared-minio || true
