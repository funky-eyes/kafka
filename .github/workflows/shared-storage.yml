name: Shared Storage

on:
  push:
    branches:
      - shared-wal-s3-4.3.1
    paths:
      - 'storage/src/main/java/org/apache/kafka/storage/internals/shared/**'
      - 'storage/src/test/java/org/apache/kafka/storage/internals/shared/**'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/log/LogLoader.java'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/log/LocalLog.java'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/log/LogSegmentFactory.java'
      - 'storage/src/test/java/org/apache/kafka/storage/internals/log/LogLoaderSegmentFactoryTest.java'
      - '.github/workflows/shared-storage.yml'
  pull_request:
    paths:
      - 'storage/src/main/java/org/apache/kafka/storage/internals/shared/**'
      - 'storage/src/test/java/org/apache/kafka/storage/internals/shared/**'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/log/LogLoader.java'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/log/LocalLog.java'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/log/LogSegmentFactory.java'
      - 'storage/src/test/java/org/apache/kafka/storage/internals/log/LogLoaderSegmentFactoryTest.java'
      - '.github/workflows/shared-storage.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-storage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  storage-tests:
    name: Storage tests (Java 25)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          java-version: 25
          gradle-cache-read-only: true

      - name: Compile shared storage sources
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :storage:compileJava :storage:compileTestJava --no-scan 2>&1 | tee shared-storage-compile.log

      - name: Run shared storage tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :storage:test --no-scan \
            --tests 'org.apache.kafka.storage.internals.shared.*' \
            --tests 'org.apache.kafka.storage.internals.shared.metadata.*' \
            --tests 'org.apache.kafka.storage.internals.shared.object.*' \
            --tests 'org.apache.kafka.storage.internals.shared.wal.*' \
            2>&1 | tee shared-storage-test.log

      - name: Upload compile and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-storage-ci-logs
          path: |
            shared-storage-compile.log
            shared-storage-test.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload static analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-storage-static-analysis
          path: |
            storage/build/reports/spotbugs
            storage/build/reports/checkstyle
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-storage-test-reports
          path: storage/build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 7

  minio-environment:
    name: MinIO E2E environment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Start MinIO
        run: |
          docker run --detach \
            --name kafka-shared-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadmin123 \
            minio/minio:latest \
            server /data --address :9000

      - name: Wait for MinIO readiness
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs kafka-shared-minio
          exit 1

      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          java-version: 25
          gradle-cache-read-only: true

      - name: Compile shared storage sources against E2E environment
        shell: bash
        env:
          SHARED_STORAGE_S3_ENDPOINT: http://127.0.0.1:9000
          SHARED_STORAGE_S3_ACCESS_KEY: minioadmin
          SHARED_STORAGE_S3_SECRET_KEY: minioadmin123
          SHARED_STORAGE_S3_BUCKET: kafka-shared-storage-e2e
        run: |
          set -o pipefail
          ./gradlew :storage:compileJava :storage:compileTestJava --no-scan 2>&1 | tee shared-storage-minio-compile.log

      - name: Upload MinIO compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-storage-minio-compile-log
          path: shared-storage-minio-compile.log
          if-no-files-found: ignore
          retention-days: 7

      - name: MinIO logs
        if: always()
        run: docker logs kafka-shared-minio || true
