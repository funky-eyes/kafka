name: Apply Shared Broker Ready Seam Once

on:
  push:
    branches:
      - shared-wal-s3-4.3.1
    paths:
      - '.github/workflows/shared-storage-broker-ready-once.yml'

permissions:
  contents: write

jobs:
  apply-seam:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current development branch
        uses: actions/checkout@v5
        with:
          ref: shared-wal-s3-4.3.1
          fetch-depth: 250
          persist-credentials: true

      - name: Wait for normalized branch head
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 45); do
            git fetch --no-tags origin "${GITHUB_REF_NAME}"
            email=$(git show -s --format='%ae' "origin/${GITHUB_REF_NAME}")
            if [ "${email}" = 'jianbin@apache.org' ]; then
              git reset --hard "origin/${GITHUB_REF_NAME}"
              exit 0
            fi
            sleep 2
          done
          echo 'Timed out waiting for author normalization' >&2
          exit 1

      - name: Patch BrokerServer broker-ready lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('core/src/main/scala/kafka/server/BrokerServer.scala')
          text = path.read_text()
          if 'StorageExtensionBrokerContext' in text:
              print('Broker-ready storage extension seam already present.')
              raise SystemExit(0)

          old_import = 'import org.apache.kafka.storage.internals.log.{KafkaStorageExtension, LogDirFailureChannel, StorageExtensionContext, StorageExtensionLoader}'
          new_import = 'import org.apache.kafka.storage.internals.log.{KafkaStorageExtension, LogDirFailureChannel, StorageExtensionBrokerContext, StorageExtensionContext, StorageExtensionLoader}'
          assert text.count(old_import) == 1
          text = text.replace(old_import, new_import)

          anchor_lines = [
              '      FutureUtils.waitWithLogging(logger.underlying, logIdent,',
              '        "all of the SocketServer Acceptors to be started",',
              '        enableRequestProcessingFuture, startupDeadline, time)',
              '',
              '      remoteLogManagerOpt.foreach(rlm =>',
          ]
          anchor = '\n'.join(anchor_lines) + '\n'
          replacement_lines = [
              '      FutureUtils.waitWithLogging(logger.underlying, logIdent,',
              '        "all of the SocketServer Acceptors to be started",',
              '        enableRequestProcessingFuture, startupDeadline, time)',
              '',
              '      storageExtensionOpt.foreach(extension => {',
              '        val extensionReadyContext = new StorageExtensionBrokerContext(',
              '          clusterId,',
              '          config.brokerId,',
              '          listenerInfo.listeners().values().asScala.toList.asJava,',
              '          config.originals(),',
              '          time)',
              '        FutureUtils.waitWithLogging(logger.underlying, logIdent,',
              '          "the storage extension to become broker-ready",',
              '          extension.onBrokerReady(extensionReadyContext), startupDeadline, time)',
              '      })',
              '',
              '      remoteLogManagerOpt.foreach(rlm =>',
          ]
          replacement = '\n'.join(replacement_lines) + '\n'
          assert text.count(anchor) == 1
          text = text.replace(anchor, replacement)
          path.write_text(text)
          PY

          git diff --check
          git diff -- core/src/main/scala/kafka/server/BrokerServer.scala

      - name: Commit seam when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- core/src/main/scala/kafka/server/BrokerServer.scala; then
            exit 0
          fi
          git config user.name 'Jianbin Chen'
          git config user.email 'jianbin@apache.org'
          git add core/src/main/scala/kafka/server/BrokerServer.scala
          git commit -m 'KAFKA-Shared: gate broker startup on storage extension readiness'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
