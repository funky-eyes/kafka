name: Shared Storage S3 Outage

on:
  push:
    branches:
      - shared-wal-s3-4.3.1
    paths:
      - 'server/src/main/java/org/apache/kafka/server/BrokerLifecycleManager.java'
      - 'gradle.properties'
      - 'gradle/dependencies.gradle'
      - 'gradlew'
      - 'wrapper.gradle'
      - 'gradle/wrapper/gradle-wrapper.properties'
      # Every production-fingerprint change invalidates this gate's GA evidence.
      - 'build.gradle'
      - 'settings.gradle'
      - 'storage/shared-storage-s3/build.gradle'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/shared/**'
      - 'storage/src/main/java/org/apache/kafka/storage/internals/log/**'
      - 'core/src/main/scala/kafka/cluster/Partition.scala'
      - 'core/src/main/scala/kafka/log/LogManager.scala'
      - 'core/src/main/scala/kafka/server/**'
      - 'core/src/main/java/kafka/server/builders/LogManagerBuilder.java'
      - 'core/src/test/**'
      - 'core/src/test/java/kafka/server/SharedStorageS3OutageKRaftIntegrationTest.java'
      - 'storage/src/main/**'
      - 'storage/shared-storage-s3/src/main/**'
      - 'core/src/main/scala/kafka/server/ReplicaFetcherThread.scala'
      - '.github/actions/setup-gradle/**'
      - '.github/actions/setup-minio/**'
      - 'tools/shared_storage_minio_fixture.sh'
      - '.github/workflows/shared-storage-s3-outage.yml'
  pull_request:
    paths:
      - 'server/src/main/java/org/apache/kafka/server/BrokerLifecycleManager.java'
      - 'core/src/test/**'
      - 'core/src/test/java/kafka/server/SharedStorageS3OutageKRaftIntegrationTest.java'
      - 'storage/src/main/**'
      - 'storage/shared-storage-s3/src/main/**'
      - 'core/src/main/scala/kafka/server/ReplicaFetcherThread.scala'
      - '.github/workflows/shared-storage-s3-outage.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-storage-s3-outage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  s3-outage-failover:
    name: acks=all through S3 outage and leader failover
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup pinned MinIO fixture
        uses: ./.github/actions/setup-minio
        with:
          bucket: kafka-shared-storage-s3-outage
      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          java-version: 25
          gradle-cache-read-only: true

      - name: Run S3 outage and leader failover E2E
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin123
          AWS_REGION: us-east-1
          SHARED_STORAGE_S3_ENDPOINT: http://127.0.0.1:9000
          SHARED_STORAGE_S3_REGION: us-east-1
          SHARED_STORAGE_S3_BUCKET: kafka-shared-storage-s3-outage
          SHARED_STORAGE_S3_CONTROL: ${{ github.workspace }}/tools/shared_storage_minio_fixture.sh
        run: |
          set -o pipefail
          ./gradlew :core:test \
            --tests 'kafka.server.SharedStorageS3OutageKRaftIntegrationTest' \
            -x :core:checkstyleMain \
            -x :core:checkstyleTest \
            -x :core:spotbugsMain \
            -x :core:spotbugsTest \
            --no-scan 2>&1 | tee shared-storage-s3-outage-e2e.log

          result_xml="$(find core/build/test-results build/junit-xml \
            -type f \
            -name 'TEST-kafka.server.SharedStorageS3OutageKRaftIntegrationTest.xml' \
            -print -quit 2>/dev/null || true)"
          test -n "$result_xml"
          grep -q '<testsuite ' "$result_xml"
          grep -q 'failures="0"' "$result_xml"
          grep -q 'errors="0"' "$result_xml"
          grep -q 'skipped="0"' "$result_xml"
          grep -q 'S3_OUTAGE_STARTED oldLeader=' "$result_xml"
          grep -q 'S3_OUTAGE_ACKED range=' "$result_xml"
          grep -q 'S3_OUTAGE_FAILOVER oldLeader=' "$result_xml"
          grep -q 'S3_OUTAGE_RECOVERED newLeader=' "$result_xml"

          {
            grep 'S3_OUTAGE_STARTED oldLeader=' "$result_xml"
            grep 'S3_OUTAGE_ACKED range=' "$result_xml"
            grep 'S3_OUTAGE_FAILOVER oldLeader=' "$result_xml"
            grep 'S3_OUTAGE_RECOVERED newLeader=' "$result_xml"
            printf 'S3_OUTAGE_SUCCESS commit=%s\n' "$GITHUB_SHA"
          } > shared-storage-s3-outage-proof.txt
          cat shared-storage-s3-outage-proof.txt

      - name: Ensure MinIO is running for diagnostics
        if: always()
        run: |
          "${GITHUB_WORKSPACE}/tools/shared_storage_minio_fixture.sh" start
          "${GITHUB_WORKSPACE}/tools/shared_storage_minio_fixture.sh" wait-ready 30 || true
      - name: Show committed S3 objects
        if: always()
        run: |
          "${GITHUB_WORKSPACE}/tools/shared_storage_minio_fixture.sh" ls "kafka-shared-storage-s3-outage" | tee shared-storage-s3-outage-objects.log || true
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-storage-s3-outage-log
          path: |
            shared-storage-s3-outage-e2e.log
            shared-storage-s3-outage-proof.txt
            shared-storage-s3-outage-objects.log
            core/build/reports/tests/test
            core/build/test-results/test
            build/junit-xml/core
          if-no-files-found: ignore
          retention-days: 7

      - name: MinIO logs
        if: always()
        run: |
          "${GITHUB_WORKSPACE}/tools/shared_storage_minio_fixture.sh" logs || true