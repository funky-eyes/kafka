name: Shared Storage WAL Capacity

on:
  push:
    branches:
      - shared-wal-s3-4.3.1
    paths:
      - 'core/src/test/java/kafka/server/SharedStorageWalCapacityPressureKRaftIntegrationTest.java'
      - 'storage/src/main/**'
      - 'storage/shared-storage-s3/src/main/**'
      - 'core/src/main/scala/kafka/server/ReplicaFetcherThread.scala'
      - '.github/workflows/shared-storage-wal-capacity.yml'
  pull_request:
    paths:
      - 'core/src/test/java/kafka/server/SharedStorageWalCapacityPressureKRaftIntegrationTest.java'
      - 'storage/src/main/**'
      - 'storage/shared-storage-s3/src/main/**'
      - 'core/src/main/scala/kafka/server/ReplicaFetcherThread.scala'
      - '.github/workflows/shared-storage-wal-capacity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-storage-wal-capacity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wal-capacity-backpressure:
    name: S3 outage reaches Ring WAL capacity and reuses reclaimed window
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Start MinIO
        run: |
          docker run --detach \
            --name kafka-shared-minio-wal-capacity \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadmin123 \
            minio/minio:latest \
            server /data --address :9000

      - name: Wait for MinIO readiness
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs kafka-shared-minio-wal-capacity
          exit 1

      - name: Ensure MinIO bucket exists
        run: |
          docker run --rm --network host --entrypoint /bin/sh minio/mc:latest -c '
            mc alias set local http://127.0.0.1:9000 minioadmin minioadmin123 >/dev/null &&
            mc mb --ignore-existing local/kafka-shared-storage-wal-capacity >/dev/null
          '

      - name: Setup Gradle
        uses: ./.github/actions/setup-gradle
        with:
          java-version: 25
          gradle-cache-read-only: true

      - name: Run WAL capacity pressure E2E
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin123
          AWS_REGION: us-east-1
          SHARED_STORAGE_S3_ENDPOINT: http://127.0.0.1:9000
          SHARED_STORAGE_S3_REGION: us-east-1
          SHARED_STORAGE_S3_BUCKET: kafka-shared-storage-wal-capacity
          SHARED_STORAGE_S3_CONTAINER: kafka-shared-minio-wal-capacity
        run: |
          set -o pipefail
          ./gradlew :core:test \
            --tests 'kafka.server.SharedStorageWalCapacityPressureKRaftIntegrationTest' \
            --no-scan 2>&1 | tee shared-storage-wal-capacity-e2e.log

          result_xml="$(find core/build/test-results build/junit-xml \
            -type f \
            -name 'TEST-kafka.server.SharedStorageWalCapacityPressureKRaftIntegrationTest.xml' \
            -print -quit 2>/dev/null || true)"
          test -n "$result_xml"
          grep -q '<testsuite ' "$result_xml"
          grep -q 'failures="0"' "$result_xml"
          grep -q 'errors="0"' "$result_xml"
          grep -q 'skipped="0"' "$result_xml"
          grep -q 'WAL_CAPACITY_OUTAGE_STARTED capacityBytes=' "$result_xml"
          grep -q 'WAL_CAPACITY_BACKPRESSURE acknowledged=' "$result_xml"
          grep -q 'WAL_CAPACITY_BROKER_ONLINE brokers=3' "$result_xml"
          grep -q 'WAL_CAPACITY_RING_REUSED offset=' "$result_xml"
          grep -q 'WAL_CAPACITY_REMOTE_RECOVERED range=' "$result_xml"

          {
            grep 'WAL_CAPACITY_OUTAGE_STARTED capacityBytes=' "$result_xml"
            grep 'WAL_CAPACITY_BACKPRESSURE acknowledged=' "$result_xml"
            grep 'WAL_CAPACITY_BROKER_ONLINE brokers=3' "$result_xml"
            grep 'WAL_CAPACITY_RING_REUSED offset=' "$result_xml"
            grep 'WAL_CAPACITY_REMOTE_RECOVERED range=' "$result_xml"
            printf 'WAL_CAPACITY_SUCCESS commit=%s\n' "$GITHUB_SHA"
          } > shared-storage-wal-capacity-proof.txt
          cat shared-storage-wal-capacity-proof.txt

      - name: Ensure MinIO is running for diagnostics
        if: always()
        run: |
          docker start kafka-shared-minio-wal-capacity >/dev/null 2>&1 || true
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 0

      - name: Show committed S3 objects
        if: always()
        run: |
          docker run --rm --network host --entrypoint /bin/sh minio/mc:latest -c '
            mc alias set local http://127.0.0.1:9000 minioadmin minioadmin123 >/dev/null &&
            mc ls --recursive local/kafka-shared-storage-wal-capacity || true
          ' | tee shared-storage-wal-capacity-objects.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-storage-wal-capacity-log
          path: |
            shared-storage-wal-capacity-e2e.log
            shared-storage-wal-capacity-proof.txt
            shared-storage-wal-capacity-objects.log
            core/build/reports/tests/test
            core/build/test-results/test
            build/junit-xml/core
          if-no-files-found: ignore
          retention-days: 7

      - name: MinIO logs
        if: always()
        run: docker logs kafka-shared-minio-wal-capacity || true
